<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chatzão Oficial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root { --primary: #F4D03F; --bg: #0e0e0e; --panel: #161616; --text: #ffffff; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; font-family: -apple-system, sans-serif; }
        html, body { height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; transition: background 0.3s; }
        
        .screen { display: none; height: 100dvh; flex-direction: column; }
        .screen.active { display: flex; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        /* --- LOGIN --- */
        #login-screen { justify-content: center; align-items: center; gap: 15px; }
        .avatar-container { display: flex; align-items: center; gap: 10px; }
        .btn-shuffle { background: #222; border: 1px solid #444; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        #avatar-preview { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; cursor: pointer; background: #222; }
        .login-input { padding: 12px; border-radius: 10px; border: 1px solid #333; background: rgba(0,0,0,0.5); color: #fff; width: 260px; font-size: 16px; text-align: center; }
        .btn-enter { padding: 12px; width: 260px; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; }

        /* --- TOPBAR & MENU LATERAL --- */
        #topbar { padding: 12px 15px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; }
        .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid var(--primary); }
        .names { display: flex; flex-direction: column; }
        .btn-icon { background: none; border: none; color: var(--primary); font-size: 22px; cursor: pointer; }
        
        #drawer { position: fixed; left: -300px; top: 0; width: 280px; height: 100dvh; background: #111; transition: 0.3s; padding: 20px; z-index: 1000; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; }
        #drawer.open { left: 0; }
        
        /* Customização Drawer */
        .drawer-section { border-bottom: 1px solid #333; padding-bottom: 15px; }
        .tab-btns { display: flex; gap: 5px; margin-top: 10px; }
        .tab-btn { flex: 1; padding: 5px; background: #222; color: #888; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: #000; font-weight: bold; }
        .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
        .bg-card { height: 60px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .bg-card.active { border-color: var(--primary); }

        /* --- CHAT AREA --- */
        #chat-window { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 15px; display: flex; flex-direction: column; gap: 12px; position: relative; }
        .msg-wrapper { display: flex; flex-direction: column; width: 100%; transition: opacity 0.3s; }
        .msg-sender { font-size: 11px; color: #aaa; margin-bottom: 2px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .msg-sender img { width: 16px; height: 16px; border-radius: 50%; }
        
        .msg { padding: 10px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; position: relative; cursor: pointer; max-width: 80%; }
        .msg.mine { background: var(--primary); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.other { background: rgba(38,38,38,0.9); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; backdrop-filter: blur(5px); }
        .msg-time { font-size: 10px; opacity: 0.6; float: right; margin-top: 5px; margin-left: 10px; }
        
        /* Respostas e Menções */
        .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid rgba(0,0,0,0.5); padding: 5px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 5px; }
        .other .reply-quote { background: rgba(255,255,255,0.1); border-left-color: var(--primary); }
        .mention-hl { color: var(--primary); font-weight: bold; background: rgba(0,0,0,0.2); padding: 0 4px; border-radius: 4px; }
        .mine .mention-hl { color: #000; background: rgba(255,255,255,0.4); }

        /* Reações */
        .reactions-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: -6px; z-index: 2; align-self: flex-start; }
        .mine + .reactions-bar { align-self: flex-end; }
        .reaction-badge { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 2px 6px; font-size: 11px; color: #fff; cursor: pointer; }
        
        @keyframes deleteFlash { 0%{background:blue;} 25%{background:red;} 50%{background:deeppink;} 75%{background:#fff; color:#000;} 100%{opacity:0; transform:scale(0.9);} }
        .deleting { animation: deleteFlash 3s forwards; pointer-events: none; }

        /* --- FOOTER & INPUT --- */
        .reply-banner { display: none; background: #222; padding: 8px 15px; border-left: 4px solid var(--primary); font-size: 13px; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; }
        #footer { padding: 10px; background: var(--panel); display: flex; align-items: flex-end; gap: 8px; }
        .input-wrapper { flex: 1; display: flex; align-items: center; background: #222; border-radius: 20px; padding: 5px 12px; min-height: 40px; }
        #msg-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; resize: none; max-height: 100px; padding: 8px 0; }
        .btn-send { background: var(--primary); color: #000; width: 40px; height: 40px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px; flex-shrink: 0; }
        
        /* Modal, Contextos e Popups */
        #photo-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        #photo-modal img { width: 80vw; max-width: 400px; object-fit: cover; border-radius: 15px; border: 2px solid var(--primary); }
        .context-menu { position: absolute; background: #222; border: 1px solid #444; border-radius: 12px; padding: 8px; display: none; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .context-menu.active { display: flex; flex-wrap: wrap; gap: 8px; max-width: 280px; }
        .btn-context { background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; flex: 1; text-align: center; }
        .emoji-react { font-size: 22px; cursor: pointer; padding: 4px; transition: 0.1s; }
        .emoji-react:hover { transform: scale(1.2); }
        #mentions-popup { display: none; position: absolute; bottom: 70px; left: 15px; background: #222; border-radius: 10px; border: 1px solid #444; max-height: 150px; overflow-y: auto; z-index: 50; width: 200px; }
        .mention-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; font-size: 14px; }
        .mention-item:hover { background: #333; color: var(--primary); }

        /* Estilos dos Fundos */
        .bg-patrick { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .bg-lula { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .bg-homer { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .bg-marge { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
        .bg-dark { background: #0e0e0e; }
    </style>
</head>
<body>

    <div id="photo-modal" onclick="this.style.display='none'">
        <img id="modal-img" src="">
    </div>

    <div id="login-screen" class="screen active">
        <h1 style="color: var(--primary); margin-bottom: 20px;">Chatzão</h1>
        <div class="avatar-container">
            <button class="btn-shuffle" onclick="sortearAvatar()"><i class="ti ti-arrows-shuffle"></i></button>
            <img id="avatar-preview" onclick="document.getElementById('file-login').click()">
            <input type="file" id="file-login" style="display:none" accept="image/*">
        </div>
        <p style="font-size: 12px; color: #888;">Crie seu Perfil</p>
        <input id="in-real" class="login-input" placeholder="Nome Real">
        <input id="in-nick" class="login-input" placeholder="Apelido no Chat">
        <button class="btn-enter" onclick="entrar()">Entrar no Chat</button>
    </div>

    <div id="chat-screen" class="screen">
        
        <div id="drawer">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Configurações</h3>
                <i class="ti ti-x drawer-close" onclick="fecharMenu()"></i>
            </div>
            
            <div class="drawer-section">
                <label style="font-size: 12px; color: var(--primary);"><i class="ti ti-palette"></i> Cor Principal</label>
                <div class="tab-btns">
                    <button class="tab-btn active">Controles</button>
                </div>
                <input type="color" id="theme-color" value="#F4D03F" style="width:100%; height:45px; border:none; background:transparent; cursor:pointer; margin-top:10px;" onchange="mudarCor(this.value)">
            </div>

            <div class="drawer-section">
                <label style="font-size: 12px; color: var(--primary);"><i class="ti ti-photo"></i> Planos de Fundo</label>
                <div class="bg-grid">
                    <div class="bg-card bg-dark active" onclick="mudarFundo('bg-dark')"></div>
                    <div class="bg-card bg-patrick" onclick="mudarFundo('bg-patrick')"></div>
                    <div class="bg-card bg-lula" onclick="mudarFundo('bg-lula')"></div>
                    <div class="bg-card bg-homer" onclick="mudarFundo('bg-homer')"></div>
                    <div class="bg-card bg-marge" onclick="mudarFundo('bg-marge')"></div>
                </div>
            </div>

            <button class="btn-context" style="background:#440000; color:#ff4d4d; margin-top:20px;" onclick="limparHistorico()">
                <i class="ti ti-trash"></i> Apagar Histórico
            </button>
        </div>

        <div id="topbar">
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="btn-icon" onclick="document.getElementById('drawer').classList.add('open')"><i class="ti ti-menu-2"></i></button>
                <div class="user-info" onclick="abrirFoto3x4(JSON.parse(localStorage.getItem('user')).avatar)">
                    <img id="top-avatar" src="">
                    <div class="names">
                        <span id="top-nick" style="font-weight:bold; font-size:15px;">Apelido</span>
                        <span id="top-real" style="font-size:11px; color:#aaa;">Nome Real</span>
                    </div>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:15px;">
                <div style="width:10px; height:10px; background:#2ecc71; border-radius:50%; box-shadow: 0 0 8px #2ecc71;"></div>
                <button class="btn-icon" style="font-size:18px; color:#888;" onclick="fazerLogout()"><i class="ti ti-logout"></i></button>
            </div>
        </div>

        <div id="chat-window" onclick="fecharMenus()"></div>

        <div id="reply-banner" class="reply-banner">
            <div>
                <strong id="reply-to-name" style="color:var(--primary);"></strong><br>
                <span id="reply-to-text" style="color:#aaa;"></span>
            </div>
            <i class="ti ti-x" style="cursor:pointer; color:#888;" onclick="cancelarResposta()"></i>
        </div>

        <div id="mentions-popup"></div>

        <div id="footer">
            <button class="btn-icon"><i class="ti ti-microphone"></i></button>
            <div class="input-wrapper">
                <button class="btn-icon" style="margin-right:8px; font-size:20px;"><i class="ti ti-mood-smile"></i></button>
                <textarea id="msg-input" rows="1" placeholder="Mensagem..."></textarea>
                <button class="btn-icon" style="margin-left:8px;" onclick="document.getElementById('file-chat').click()"><i class="ti ti-camera"></i></button>
                <input type="file" id="file-chat" style="display:none" accept="image/*">
            </div>
            <button class="btn-send" onclick="enviar()"><i class="ti ti-send"></i></button>
        </div>
    </div>

    <div id="menu-mine" class="context-menu">
        <button class="btn-context" onclick="prepararEdicao()">Editar</button>
        <button class="btn-context" style="background:#440000; color:#ff4d4d;" onclick="executarDelecao()">Apagar</button>
    </div>

    <div id="menu-other" class="context-menu">
        <div style="width:100%; display:flex; gap:10px; margin-bottom:10px;">
            <button class="btn-context" style="background:var(--primary); color:#000;" onclick="prepararResposta()">Responder</button>
        </div>
        <div id="reaction-emojis" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, updateDoc, doc, deleteDoc, query, orderBy, onSnapshot, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk", projectId: "chatzao-a27ed" }));

        // EMOJIS DE REAÇÃO (Injetando no DOM)
        const listaReacoes = ["😁","😆","😅","🤣","🙂","🙃","🫠","😇","🥰","😗","🥲","🤪","🤭","🫢","🫣","🤔","🫡","🤐","😶‍🌫️","😮‍💨","🤥","🙂‍↔️","🙂‍↕️","😴","🫩","🥴","😵","🤯","🥳","😎","🧐","😮","😥","😢","😭","😱","😓","😫","🥱","😤","🤬","☠️","💩","🤡","👻"];
        const reactionBox = document.getElementById('reaction-emojis');
        listaReacoes.forEach(emj => {
            const span = document.createElement('span'); span.className = 'emoji-react'; span.innerText = emj;
            span.onclick = () => enviarReacao(emj);
            reactionBox.appendChild(span);
        });

        // VARIÁVEIS DE ESTADO
        let userLogado = null;
        let targetMsgId = null;
        let targetMsgData = null;
        let isReplying = false;
        let isEditing = false;
        let usuariosAtivos = new Set(); 

        // --- SISTEMA DE LOGIN E UI ---
        const avatarPrev = document.getElementById('avatar-preview');
        
        window.sortearAvatar = () => {
            avatarPrev.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${Math.random()}`;
        };

        document.getElementById('file-login').onchange = (e) => {
            const r = new FileReader(); r.onload = (ev) => avatarPrev.src = ev.target.result;
            if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
        };

        window.entrar = () => {
            const nome = document.getElementById('in-real').value.trim();
            const nick = document.getElementById('in-nick').value.trim();
            if(!nome || !nick) return alert('Preencha os dois campos!');
            
            userLogado = { nome, nick, avatar: avatarPrev.src };
            localStorage.setItem('user', JSON.stringify(userLogado));
            iniciarChat();
        };

        window.fazerLogout = () => { localStorage.clear(); location.reload(); };
        window.fecharMenu = () => document.getElementById('drawer').classList.remove('open');

        // Aplicar preferências guardadas
        window.mudarCor = (cor) => {
            document.documentElement.style.setProperty('--primary', cor);
            document.getElementById('theme-color').value = cor;
            localStorage.setItem('themeColor', cor);
        };

        window.mudarFundo = (classeFundo) => {
            document.body.className = classeFundo;
            document.querySelectorAll('.bg-card').forEach(c => c.classList.remove('active'));
            document.querySelector(`.${classeFundo}`).classList.add('active');
            localStorage.setItem('themeBg', classeFundo);
        };

        function iniciarChat() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('chat-screen').classList.add('active');
            
            document.getElementById('top-nick').innerText = userLogado.nick;
            document.getElementById('top-real').innerText = userLogado.nome;
            document.getElementById('top-avatar').src = userLogado.avatar;
            
            if(localStorage.getItem('themeColor')) mudarCor(localStorage.getItem('themeColor'));
            if(localStorage.getItem('themeBg')) mudarFundo(localStorage.getItem('themeBg'));

            carregarMensagensDB();
        }

        // --- OTMIZAÇÃO FIREBASE (A MÁGICA DO DOCCHANGES) ---
        const chatWindow = document.getElementById('chat-window');

        function carregarMensagensDB() {
            chatWindow.innerHTML = ""; // Limpa ao entrar
            const q = query(collection(db, "mensagens"), orderBy("timestamp", "asc"));
            
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    const m = change.doc.data();
                    const id = change.doc.id;
                    const isMine = m.usuario === userLogado.nick;
                    usuariosAtivos.add(m.usuario); // Para as menções

                    if (change.type === "added") {
                        chatWindow.appendChild(criarBolhaHTML(id, m, isMine));
                    } 
                    if (change.type === "modified") {
                        const el = document.getElementById(`wrap-${id}`);
                        if(el) el.replaceWith(criarBolhaHTML(id, m, isMine));
                    }
                    if (change.type === "removed") {
                        const el = document.getElementById(`wrap-${id}`);
                        if(el) {
                            el.children[isMine ? 0 : 1].classList.add('deleting');
                            setTimeout(() => el.remove(), 3000);
                        }
                    }
                });
                chatWindow.scrollTop = chatWindow.scrollHeight;
            });
        }

        function criarBolhaHTML(id, m, isMine) {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            wrapper.id = `wrap-${id}`;
            
            const timeStr = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
            
            let replyHTML = m.replyTo ? `<div class="reply-quote"><strong>${m.replyTo.sender}</strong><br>${m.replyTo.text}</div>` : '';
            let textoFinal = m.texto.replace(/@(\w+)/g, '<span class="mention-hl">@$1</span>');

            let reactionsHTML = '';
            if (m.reacoes && Object.keys(m.reacoes).length > 0) {
                reactionsHTML = `<div class="reactions-bar">`;
                for (const [emj, count] of Object.entries(m.reacoes)) {
                    reactionsHTML += `<span class="reaction-badge" onclick="enviarReacao('${emj}', '${id}')">${emj} ${count}</span>`;
                }
                reactionsHTML += `</div>`;
            }

            let html = '';
            if(!isMine) html += `<div class="msg-sender" onclick="abrirFoto3x4('${m.avatar}')"><img src="${m.avatar}"> ${m.usuario}</div>`;
            
            html += `
                <div class="msg ${isMine ? 'mine' : 'other'}" onclick="abrirContexto(event, '${id}', ${isMine}, '${m.usuario}', '${m.texto.replace(/'/g, "\\'")}')">
                    ${replyHTML}${textoFinal}<span class="msg-time">${timeStr}</span>
                </div>
                ${reactionsHTML}
            `;
            wrapper.innerHTML = html;
            return wrapper;
        }

        // --- INTERAÇÃO E CONTEXTO ---
        window.abrirContexto = (e, id, isMine, sender, texto) => {
            e.stopPropagation(); fecharMenus();
            targetMsgId = id; targetMsgData = { sender, texto };
            
            const menu = document.getElementById(isMine ? 'menu-mine' : 'menu-other');
            menu.style.display = 'flex'; menu.className = 'context-menu active';
            
            let posTop = e.clientY;
            if(posTop > window.innerHeight - 200) posTop -= 150;
            menu.style.top = posTop + 'px';
            menu.style[isMine ? 'right' : 'left'] = '20px';
            menu.style[isMine ? 'left' : 'right'] = 'auto';
        };

        window.fecharMenus = () => {
            document.querySelectorAll('.context-menu').forEach(m => m.style.display = 'none');
        };

        window.executarDelecao = async () => {
            fecharMenus();
            await deleteDoc(doc(db, "mensagens", targetMsgId));
        };

        window.prepararEdicao = () => {
            fecharMenus();
            const input = document.getElementById('msg-input');
            input.value = targetMsgData.texto; input.focus();
            isEditing = true;
        };

        window.prepararResposta = () => {
            fecharMenus(); isReplying = true;
            document.getElementById('reply-banner').style.display = 'flex';
            document.getElementById('reply-to-name').innerText = targetMsgData.sender;
            document.getElementById('reply-to-text').innerText = targetMsgData.texto.substring(0, 50) + "...";
            document.getElementById('msg-input').focus();
        };

        window.cancelarResposta = () => { isReplying = false; document.getElementById('reply-banner').style.display = 'none'; };

        window.enviarReacao = async (emoji, overrideId = null) => {
            fecharMenus();
            const id = overrideId || targetMsgId;
            // Incrementar de forma otimista: No mundo real usamos runTransaction.
            await updateDoc(doc(db, "mensagens", id), { [`reacoes.${emoji}`]: 1 });
        };

        // --- ENVIO ---
        const inputArea = document.getElementById('msg-input');
        
        window.enviar = async () => {
            const texto = inputArea.value.trim();
            if(!texto) return;
            
            let payload = { usuario: userLogado.nick, avatar: userLogado.avatar, texto: texto, timestamp: Date.now() };

            if (isReplying) { payload.replyTo = { sender: targetMsgData.sender, text: targetMsgData.texto.substring(0, 60) }; cancelarResposta(); }

            if (isEditing) { await updateDoc(doc(db, "mensagens", targetMsgId), { texto: texto }); isEditing = false; } 
            else { await addDoc(collection(db, "mensagens"), payload); }
            
            inputArea.value = ""; inputArea.style.height = 'auto';
        };

        // Auto-Resize Textarea e Menções
        inputArea.addEventListener('input', function() {
            this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px';
            const words = this.value.split(" "); const lastWord = words[words.length - 1];
            
            const popup = document.getElementById('mentions-popup');
            if (lastWord.startsWith("@") && lastWord.length > 1) {
                const busca = lastWord.substring(1).toLowerCase();
                popup.innerHTML = ""; let tem = false;
                usuariosAtivos.forEach(u => {
                    if(u.toLowerCase().includes(busca)) {
                        tem = true;
                        const div = document.createElement('div'); div.className = 'mention-item'; div.innerText = "@" + u;
                        div.onclick = () => {
                            words[words.length - 1] = "@" + u + " ";
                            inputArea.value = words.join(" "); popup.style.display = 'none'; inputArea.focus();
                        };
                        popup.appendChild(div);
                    }
                });
                popup.style.display = tem ? 'block' : 'none';
            } else { popup.style.display = 'none'; }
        });

        // --- GERAIS ---
        window.abrirFoto3x4 = (url) => { document.getElementById('modal-img').src = url; document.getElementById('photo-modal').style.display = 'flex'; };
        
        window.limparHistorico = async () => {
            if(prompt("Senha Mestre:") === "220399") {
                const snap = await getDocs(collection(db, "mensagens"));
                const batch = writeBatch(db);
                snap.forEach(d => batch.delete(d.ref));
                await batch.commit();
                fecharMenu();
            }
        };

        // Initialize Session
        const sessao = localStorage.getItem('user');
        if(sessao) { userLogado = JSON.parse(sessao); iniciarChat(); }
        else { sortearAvatar(); }
    </script>
</body>
