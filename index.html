<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatzão</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0e0e0e; --panel: #1a1a1a; --primary: #fcd535; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .screen { display: none; height: 100%; flex-direction: column; }
        .active { display: flex; }
        
        /* LOGIN */
        #login-screen { justify-content: center; align-items: center; padding: 20px; }
        .login-box { width: 100%; max-width: 320px; background: var(--panel); padding: 30px; border-radius: 15px; display: flex; flex-direction: column; gap: 15px; }
        .avatar-area { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 10px; }
        .avatar-box { width: 70px; height: 70px; border: 2px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
        input { padding: 15px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; }
        button { padding: 15px; background: var(--primary); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* CHAT */
        header { padding: 10px 15px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; }
        #chat-window { flex: 1; overflow-x: hidden; overflow-y: auto; padding: 10px; scroll-snap-type: y mandatory; }
        .chat-footer { padding: 10px; background: var(--panel); display: flex; gap: 10px; }
        .input-wrapper { flex: 1; }
        
        /* CONFIG/FUNDO */
        #config-screen { padding: 20px; }
        .bg-carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px 0; }
        .bg-card { min-width: 100px; height: 100px; background: #333; border: 2px solid #000; border-radius: 10px; scroll-snap-align: center; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>Chatzão</h1>
            <div class="avatar-area">
                <div id="avatar-preview" class="avatar-box">👤</div>
                <button onclick="sortearAvatar()">🔄</button>
                <input type="file" id="upload-avatar" hidden onchange="uploadFoto(this)">
                <button onclick="document.getElementById('upload-avatar').click()">📸</button>
            </div>
            <input type="text" id="in-nome" placeholder="Nome Real">
            <input type="text" id="in-nick" placeholder="Apelido">
            <button onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <header>
            <div id="user-info">
                <span id="display-user"></span> 
                <button onclick="senhaMestre()">🔒</button>
            </div>
            <button onclick="sair()">Sair</button>
        </header>
        <div id="chat-window"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" style="flex:1" placeholder="Mensagem...">
            <button onclick="enviar()">➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk",
            authDomain: "chatzao-a27ed.firebaseapp.com",
            databaseURL: "https://chatzao-a27ed-default-rtdb.firebaseio.com",
            projectId: "chatzao-a27ed",
            storageBucket: "chatzao-a27ed.firebasestorage.app",
            messagingSenderId: "923740068926",
            appId: "1:923740068926:web:f4d36655ac6c3460f5056f"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        let avatarAtual = "👤";

        window.sortearAvatar = () => {
            const avatares = ["👽", "🤖", "🤡", "😎", "🦊"];
            avatarAtual = avatares[Math.floor(Math.random() * avatares.length)];
            document.getElementById('avatar-preview').innerText = avatarAtual;
        };

        window.uploadFoto = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    avatarAtual = `<img src="${e.target.result}" style="width:100%;height:100%;border-radius:50%">`;
                    document.getElementById('avatar-preview').innerHTML = avatarAtual;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.fazerLogin = () => {
            const nome = document.getElementById('in-nome').value;
            const nick = document.getElementById('in-nick').value;
            if(nome && nick) {
                localStorage.setItem('user', JSON.stringify({ nome, nick, avatar: avatarAtual }));
                iniciarChat();
            }
        };

        const iniciarChat = () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if(!user) return;
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('chat-screen').classList.add('active');
            document.getElementById('display-user').innerText = user.nick;
            carregarMensagens();
        };

        window.sair = () => {
            localStorage.clear();
            location.reload();
        };

        window.senhaMestre = async () => {
            const senha = prompt("Senha Mestre:");
            if(senha === "220399") {
                const snapshot = await getDocs(collection(db, "mensagens"));
                snapshot.forEach(doc => deleteDoc(doc.ref));
                alert("Chat limpo!");
            } else {
                alert("Senha incorreta!");
            }
        };

        window.enviar = async () => {
            const texto = document.getElementById('msg-input').value;
            const user = JSON.parse(localStorage.getItem('user'));
            if(texto) {
                await addDoc(collection(db, "mensagens"), { texto, usuario: user.nick, timestamp: serverTimestamp() });
                document.getElementById('msg-input').value = "";
            }
        };

        const carregarMensagens = () => {
            onSnapshot(query(collection(db, "mensagens"), orderBy("timestamp", "asc")), (snap) => {
                const win = document.getElementById('chat-window');
                win.innerHTML = "";
                snap.forEach(doc => {
                    const msg = doc.data();
                    win.innerHTML += `<div style="padding:10px; border-bottom:1px solid #333">${msg.usuario}: ${msg.texto}</div>`;
                });
            });
        };

        // Login automático
        if(localStorage.getItem('user')) iniciarChat();
    </script>
</body>
</html>
