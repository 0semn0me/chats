<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatzão Final</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root { --primary: #F4D03F; --bg: #0e0e0e; --panel: #161616; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; }
        
        #topbar { padding: 15px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 12px; border-radius: 15px; background: #262626; max-width: 80%; cursor: pointer; transition: 0.3s; }
        .msg.mine { background: var(--primary); color: #000; align-self: flex-end; }
        
        /* Efeito de deleção (as 5 cores) */
        @keyframes pulse {
            0% { background: blue; } 20% { background: red; } 40% { background: deeppink; } 60% { background: #fff; color:#000; } 80% { background: green; } 100% { background: #262626; }
        }
        .deleting { animation: pulse 8s linear; }

        #footer { padding: 10px; background: var(--panel); display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #222; color: #fff; }
    </style>
</head>
<body>

<div id="topbar">
    <div>Chat Amigos <i class="ti ti-lock" onclick="senhaMestre()"></i></div>
    <input type="color" onchange="document.documentElement.style.setProperty('--primary', this.value)">
</div>

<div id="chat"></div>

<div id="footer">
    <input id="msg-input" placeholder="Mensagem...">
    <button onclick="enviar()">Enviar</button>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, writeBatch, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk", projectId: "chatzao-a27ed" }));

    // 1. Deleção com Animação (8 segundos)
    window.apagarMsg = async (msgId) => {
        const el = document.getElementById(msgId);
        el.className = 'msg deleting';
        setTimeout(async () => {
            await deleteDoc(doc(db, "mensagens", msgId));
        }, 8000);
    };

    // 2. Limpeza Total (Garantida com Batch)
    window.senhaMestre = async () => {
        if(prompt("Senha:") === "220399") {
            const snap = await getDocs(collection(db, "mensagens"));
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
            location.reload();
        }
    };

    // 3. Renderização
    onSnapshot(query(collection(db, "mensagens"), orderBy("timestamp", "asc")), (snap) => {
        const chat = document.getElementById('chat');
        chat.innerHTML = "";
        snap.forEach(d => {
            const m = d.data();
            const div = document.createElement('div');
            div.id = d.id;
            div.className = `msg ${m.usuario === 'Eu' ? 'mine' : ''}`;
            div.innerText = m.texto;
            div.onclick = () => apagarMsg(d.id); // Ao clicar, inicia a deleção
            chat.appendChild(div);
        });
    });

    window.enviar = async () => {
        const input = document.getElementById('msg-input');
        if(!input.value) return;
        await addDoc(collection(db, "mensagens"), { usuario: 'Eu', texto: input.value, timestamp: Date.now() });
        input.value = "";
    };
</script>
</body>
</html>
