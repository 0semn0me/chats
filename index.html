<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chatzão</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --tp: #F4D03F;
      --tp-text: #000;
      --bg0: #0a0a0a;
      --bg1: #111111;
      --bg2: #1a1a1a;
      --bg3: #222222;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #777777;
      --green: #1DB954;
      --radius: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100%; height: 100dvh;
      background: var(--bg0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: pan-x pan-y;
    }

    /* ── SCREENS ── */
    .screen { display: none; flex-direction: column; height: 100dvh; }
    .screen.active { display: flex; }

    /* ═══════════════════════════════
       LOGIN SCREEN
    ═══════════════════════════════ */
    #login-screen {
      align-items: center; justify-content: center;
      padding: 24px; gap: 0;
      background: var(--bg0);
    }
    .login-card {
      width: 100%; max-width: 360px;
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .login-title { font-size: 22px; font-weight: 700; color: var(--tp); letter-spacing: -0.5px; }
    .login-subtitle { font-size: 13px; color: var(--muted); }

    /* Avatar picker */
    .avatar-ring {
      position: relative; width: 84px; height: 84px;
    }
    .avatar-ring img {
      width: 84px; height: 84px; border-radius: 50%;
      border: 2.5px solid var(--tp);
      object-fit: cover; background: var(--bg2);
      display: block;
    }
    .avatar-upload-btn {
      position: absolute; bottom: 0; right: 0;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--tp); border: 2px solid var(--bg1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 12px; color: #000;
    }
    #avatar-file-input { display: none; }

    .login-inputs { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .login-inputs input {
      width: 100%; padding: 12px 14px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-size: 15px; outline: none;
      transition: border-color 0.2s;
    }
    .login-inputs input:focus { border-color: var(--tp); }
    .login-inputs input::placeholder { color: var(--muted); }
    .login-err { font-size: 12px; color: #E24B4A; display: none; width: 100%; }

    .btn-entrar {
      width: 100%; padding: 13px;
      background: var(--tp); color: var(--tp-text);
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-entrar:hover { opacity: 0.9; }

    /* ═══════════════════════════════
       CHAT SCREEN
    ═══════════════════════════════ */
    #chat-screen { position: relative; overflow: hidden; }

    /* Topbar */
    #topbar {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; z-index: 10;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .tb-btn {
      background: none; border: none;
      color: var(--text); font-size: 20px;
      cursor: pointer; display: flex; align-items: center;
      padding: 4px;
    }
    .tb-center {
      display: flex; align-items: center; gap: 9px;
      flex: 1; justify-content: center;
    }
    .tb-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid var(--tp); object-fit: cover;
      background: var(--bg2); flex-shrink: 0;
    }
    .tb-names { display: flex; flex-direction: column; }
    .tb-nick { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .tb-name { font-size: 11px; color: var(--muted); }
    .online-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; flex-shrink: 0; }
    .btn-sair {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 5px 10px;
      border-radius: 7px; cursor: pointer;
      font-size: 12px; display: flex; align-items: center; gap: 4px;
      transition: color 0.15s;
    }
    .btn-sair:hover { color: #E24B4A; }

    /* Messages */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
      min-height: 0;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 99px; }

    .msg { display: flex; flex-direction: column; max-width: 78%; gap: 2px; }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.theirs { align-self: flex-start; align-items: flex-start; }
    .msg-sender {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--muted); margin-bottom: 1px;
    }
    .msg-sender img { width: 14px; height: 14px; border-radius: 50%; }
    .bubble {
      padding: 9px 13px; border-radius: 14px;
      font-size: 14px; line-height: 1.5;
      word-break: break-word; white-space: pre-wrap;
      cursor: pointer; position: relative;
      transition: background 0.15s;
    }
    .mine .bubble {
      background: var(--tp); color: var(--tp-text);
      border-bottom-right-radius: 3px;
      border: 1px solid rgba(0,0,0,0.12);
    }
    .theirs .bubble {
      background: var(--bg2); color: var(--text);
      border-bottom-left-radius: 3px;
    }
    .bubble img { max-width: 220px; max-height: 220px; border-radius: 8px; display: block; }
    .bubble audio { width: 180px; }
    .bubble.deleted-flash { border-radius: 14px; }
    .msg-meta { font-size: 10px; color: var(--muted); padding: 0 4px; }
    .msg-edited { font-size: 10px; color: var(--muted); font-style: italic; }

    /* Msg action menu */
    .msg-menu {
      position: absolute; z-index: 200;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 4px 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      min-width: 120px;
    }
    .msg-menu button {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 9px 14px;
      background: none; border: none; color: var(--text);
      font-size: 13px; cursor: pointer; text-align: left;
    }
    .msg-menu button:hover { background: var(--bg3); }
    .msg-menu .delete-btn { color: #E24B4A; }

    /* System messages */
    .sys-msg {
      align-self: center; font-size: 11px;
      color: var(--muted); background: rgba(0,0,0,0.4);
      padding: 3px 10px; border-radius: 99px;
    }

    /* ── INPUTBAR ── */
    #inputbar {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 10px 14px;
      padding-bottom: calc(10px + var(--safe-bottom));
      background: var(--bg1);
      border-top: 1px solid var(--border);
      flex-shrink: 0; position: relative;
    }
    .btn-icon {
      background: none; border: none;
      color: var(--tp); font-size: 22px;
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: background 0.1s;
    }
    .btn-icon:hover { background: var(--bg3); }
    #msg-input {
      flex: 1; background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 9px 14px;
      font-size: 14px; color: var(--text);
      outline: none; resize: none;
      max-height: 100px; font-family: inherit;
      line-height: 1.4; transition: flex 0.25s ease;
    }
    #msg-input::placeholder { color: var(--muted); }
    #send-btn {
      background: var(--tp); color: var(--tp-text);
      border: none; border-radius: 50%;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; flex-shrink: 0;
      transition: transform 0.1s;
    }
    #send-btn:active { transform: scale(0.92); }

    /* ── AUDIO RECORDER ── */
    #audio-recorder {
      display: none; align-items: center; gap: 8px;
      flex: 1; background: var(--bg2);
      border: 1px solid var(--tp);
      border-radius: 20px; padding: 6px 12px;
      min-height: 38px;
    }
    #audio-recorder.active { display: flex; }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #E24B4A; flex-shrink: 0; animation: blink 1s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    #rec-time { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; min-width: 40px; }
    .rec-spacer { flex: 1; }
    .rec-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--muted); display: flex; align-items: center; }
    .rec-btn.danger { color: #E24B4A; }

    /* hidden file input for camera/gallery */
    #camera-input { display: none; }

    /* ── REPLY PREVIEW (acima do inputbar) ── */
    #reply-preview {
      display: none; align-items: center; gap: 10px;
      position: absolute; bottom: 100%; left: 0; right: 0;
      background: var(--bg2); border-top: 1px solid var(--border);
      padding: 8px 14px; z-index: 260;
    }
    #reply-preview.open { display: flex; }
    .reply-bar-accent {
      width: 3px; align-self: stretch;
      background: var(--tp); border-radius: 99px; flex-shrink: 0;
    }
    .reply-bar-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .reply-bar-user { font-size: 12px; font-weight: 700; color: var(--tp); }
    .reply-bar-text {
      font-size: 12px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reply-bar-close {
      background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; padding: 4px;
    }

    /* Quote de resposta dentro da bolha */
    .msg-reply-quote {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 8px; margin-bottom: 5px;
      border-radius: 8px; cursor: pointer;
      background: rgba(0,0,0,0.18);
      max-width: 100%;
    }
    .mine .msg-reply-quote { background: rgba(0,0,0,0.12); }
    .msg-reply-quote-accent {
      width: 2.5px; align-self: stretch; min-height: 22px;
      background: currentColor; opacity: 0.55; border-radius: 99px; flex-shrink: 0;
    }
    .msg-reply-quote-body { min-width: 0; }
    .msg-reply-quote-user { font-size: 11.5px; font-weight: 700; opacity: 0.85; }
    .msg-reply-quote-text {
      font-size: 12px; opacity: 0.7;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    }
    .bubble.flash-highlight { animation: flashHighlight 1.2s ease; }
    @keyframes flashHighlight {
      0%, 100% { filter: brightness(1); }
      30% { filter: brightness(1.6); }
    }

    /* ── MENÇÕES (@) ── */
    .mention { color: var(--tp); font-weight: 700; }
    .mine .mention { color: var(--tp-text); text-decoration: underline; }
    .bubble.mentioned-me {
      box-shadow: 0 0 0 2px var(--tp);
    }
    #mention-popup {
      display: none; position: absolute;
      bottom: 100%; left: 0; right: 0;
      background: var(--bg1); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 6px;
      max-height: 180px; overflow-y: auto;
      z-index: 320; box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
    }
    #mention-popup.open { display: block; }
    .mention-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; cursor: pointer;
    }
    .mention-item:hover, .mention-item.sel { background: var(--bg3); }
    .mention-item img { width: 26px; height: 26px; border-radius: 50%; background: var(--bg2); flex-shrink: 0; }
    .mention-item-nick { font-size: 13px; font-weight: 700; }
    .mention-item-name { font-size: 11px; color: var(--muted); }

    /* ── EMOJI PICKER ── */
    #emoji-panel {
      display: none; position: absolute;
      bottom: calc(100% + 4px); right: 0; left: 0;
      background: var(--bg1); border: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      z-index: 300; max-height: 300px;
      flex-direction: column;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
    }
    #emoji-panel.open { display: flex; }
    .ep-tabs {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ep-tab {
      flex: 1; padding: 10px;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 18px;
      border-bottom: 2px solid transparent;
      transition: color 0.1s;
    }
    .ep-tab.active { color: var(--tp); border-bottom-color: var(--tp); }
    .ep-body { overflow-y: auto; padding: 10px; flex: 1; }
    .ep-grid { display: flex; flex-wrap: wrap; gap: 2px; }
    .ep-emoji {
      font-size: 26px; padding: 4px;
      cursor: pointer; border-radius: 6px;
      transition: background 0.1s; line-height: 1;
    }
    .ep-emoji:hover { background: var(--bg3); }
    /* Skin tone table */
    .ep-skin-row { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 6px; }
    .skin-btn {
      font-size: 22px; padding: 4px; cursor: pointer;
      border-radius: 6px; transition: background 0.1s;
    }
    .skin-btn:hover { background: var(--bg3); }
    .ep-section-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 8px 0 4px; }

    /* ── DRAWER (MENU HAMBURGER) ── */
    #drawer-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 400;
      backdrop-filter: blur(3px);
    }
    #drawer-overlay.open { display: block; }
    #drawer {
      position: fixed; top: 0; left: -320px; bottom: 0;
      width: 300px; max-width: 85vw;
      background: var(--bg1);
      border-right: 1px solid var(--border);
      z-index: 500; display: flex; flex-direction: column;
      transition: left 0.28s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
    }
    #drawer.open { left: 0; }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .drawer-title { font-size: 16px; font-weight: 700; color: var(--tp); }
    .drawer-close {
      background: none; border: none; color: var(--muted);
      font-size: 20px; cursor: pointer;
    }
    /* Perfil no topo do drawer */
    .drawer-profile {
      display: flex; align-items: center; gap: 12px;
      padding: 16px; border-bottom: 1px solid var(--border);
    }
    .drawer-profile img {
      width: 52px; height: 52px; border-radius: 50%;
      border: 2px solid var(--tp); object-fit: cover;
      background: var(--bg2); flex-shrink: 0;
    }
    .drawer-profile-names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .drawer-profile-nick { font-size: 15px; font-weight: 700; color: var(--text); }
    .drawer-profile-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .drawer-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .drawer-section-title {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
    }

    /* Color picker tabs */
    .cp-tabs { display: flex; gap: 0; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
    .cp-tab {
      flex: 1; padding: 8px;
      background: var(--bg2); border: none; cursor: pointer;
      color: var(--muted); font-size: 12px; font-weight: 600;
      border-right: 1px solid var(--border);
      transition: all 0.15s;
    }
    .cp-tab:last-child { border-right: none; }
    .cp-tab.active { background: var(--tp); color: var(--tp-text); }
    .cp-panel { display: none; }
    .cp-panel.active { display: block; }

    /* Grade (swatches) */
    .cp-swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .swatch {
      width: 100%; aspect-ratio: 1;
      border-radius: 50%; cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.1s;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.selected { border-color: #fff; }

    /* Espectro (hue slider) */
    .cp-hue-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    #hue-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 20px; border-radius: 99px; outline: none; cursor: pointer;
      background: linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
    }
    #hue-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px;
      border-radius: 50%; background: #fff;
      border: 2px solid #000; cursor: pointer;
    }
    .cp-preview {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid var(--border); flex-shrink: 0;
      background: var(--tp);
    }

    /* Controles (R G B) */
    .cp-controls { display: flex; flex-direction: column; gap: 8px; }
    .cp-control-row { display: flex; align-items: center; gap: 8px; }
    .cp-control-row label { width: 12px; font-size: 12px; font-weight: 700; }
    .cp-control-row label.r { color: #ff5555; }
    .cp-control-row label.g { color: #55ff55; }
    .cp-control-row label.b { color: #5599ff; }
    .cp-control-row input[type=range] {
      flex: 1; height: 6px; border-radius: 99px; cursor: pointer;
      -webkit-appearance: none; appearance: none; outline: none;
    }
    .cp-control-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; cursor: pointer;
    }
    #rgb-r { background: linear-gradient(to right, #000, #f00); }
    #rgb-g { background: linear-gradient(to right, #000, #0f0); }
    #rgb-b { background: linear-gradient(to right, #000, #00f); }
    .cp-control-row span { width: 30px; font-size: 11px; color: var(--muted); text-align: right; }

    .btn-apply-color {
      width: 100%; padding: 11px;
      background: var(--tp); color: var(--tp-text);
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 12px;
    }

    /* Planos de fundo */
    .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .bg-zoom-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 12px; color: var(--muted); font-size: 15px;
    }
    .bg-zoom-row input[type="range"] {
      flex: 1; accent-color: var(--tp); height: 4px;
    }
    .bg-zoom-val {
      font-size: 11px; color: var(--muted);
      min-width: 38px; text-align: right; font-variant-numeric: tabular-nums;
    }
    .bg-card {
      border-radius: 10px; overflow: hidden;
      cursor: pointer; position: relative;
      aspect-ratio: 9/16;
      border: 2px solid transparent;
      background: var(--bg2);
      transition: border-color 0.15s, transform 0.1s;
    }
    .bg-card:hover { transform: scale(1.03); }
    .bg-card.active { border-color: var(--tp); }
    .bg-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bg-card-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.6); font-size: 9px;
      color: #fff; text-align: center; padding: 3px 2px;
    }
    .bg-card-none {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 4px;
      color: var(--muted); font-size: 11px;
    }

    /* Cadeado / Limpar */
    .btn-lock-clear {
      width: 100%; padding: 11px;
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--muted); border-radius: 10px;
      font-size: 14px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 8px;
      transition: color 0.15s;
    }
    .btn-lock-clear:hover { color: #E24B4A; }

    /* ── EDIT MODAL ── */
    #edit-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 600;
      align-items: flex-end; justify-content: center;
      backdrop-filter: blur(4px);
    }
    #edit-overlay.open { display: flex; }
    #edit-modal {
      background: var(--bg1); border-radius: 20px 20px 0 0;
      width: 100%; max-width: 480px; padding: 20px;
      border-top: 1px solid var(--border);
    }
    #edit-input {
      width: 100%; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; color: var(--text);

// Emojis that actually support skin tones (single-person hands/people)
// We apply tone as ZWJ or modifier for those that support it
function applyTone(emoji, tone) {
  if (!tone) return emoji;
  // strip existing tone first
  const clean = emoji.replace(/[\u{1F3FB}-\u{1F3FF}]/gu, '');
  return clean + tone;
}

/* ────────────────────────────────────────────────────────────
   INIT (window.load)
──────────────────────────────────────────────────────────── */
window.addEventListener('load', () => { setTimeout(init, 200); });

function init() {
  buildSwatches();
  buildBgGrid();
  buildEmojiPanel();
  bindAll();
  loadSaved();
  initBgZoom();
}

/* ────────────────────────────────────────────────────────────
   LOAD SAVED (localStorage)
──────────────────────────────────────────────────────────── */
function loadSaved() {
  const savedNome    = localStorage.getItem('cz_nome')    || '';
  const savedApelido = localStorage.getItem('cz_apelido') || '';
  const savedAvatar  = localStorage.getItem('cz_avatar')  || '';
  const savedSeed    = localStorage.getItem('cz_seed')    || mySeed;
  const savedColor   = localStorage.getItem('cz_color')   || '#F4D03F';
  const savedBg      = localStorage.getItem('cz_bg')      || 'none';

  mySeed = savedSeed;
  applyColor(savedColor, false);
  applyBg(savedBg);

  if (savedAvatar) {
    myAvatar = savedAvatar;
    document.getElementById('login-avatar').src = savedAvatar;
  } else {
    const url = dicebear(savedSeed);
    myAvatar = url;
    document.getElementById('login-avatar').src = url;
  }

  if (savedNome && savedApelido) {
    document.getElementById('input-nome').value    = savedNome;
    document.getElementById('input-apelido').value = savedApelido;
    // auto-login
    entrar(savedNome, savedApelido);
  }
}

function dicebear(seed) {
  return `https://api.dicebear.com/7.x/adventurer/svg?seed=${seed}`;
}

/* ────────────────────────────────────────────────────────────
   BIND ALL
──────────────────────────────────────────────────────────── */
function bindAll() {
  // Login
  document.getElementById('btn-entrar').addEventListener('click', () => {
    const nome    = document.getElementById('input-nome').value.trim();
    const apelido = document.getElementById('input-apelido').value.trim();
    if (!nome || !apelido) {
      document.getElementById('login-err').style.display = 'block';
      return;
    }
    document.getElementById('login-err').style.display = 'none';
    entrar(nome, apelido);
  });
  document.getElementById('input-apelido').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-entrar').click();
  });
  document.getElementById('input-nome').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('input-apelido').focus();
  });

  // Avatar upload
  document.getElementById('avatar-upload-btn').addEventListener('click', () => {
    document.getElementById('avatar-file-input').click();
  });
  document.getElementById('avatar-file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      myAvatar = ev.target.result;
      document.getElementById('login-avatar').src = myAvatar;
      localStorage.setItem('cz_avatar', myAvatar);
    };
    reader.readAsDataURL(file);
  });

  // Sair
  document.getElementById('btn-sair').addEventListener('click', sair);

  // Drawer
  document.getElementById('btn-menu').addEventListener('click', openDrawer);
  document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
  document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

  // Color picker tabs
  document.querySelectorAll('.cp-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cp-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.cp-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${btn.dataset.panel}`).classList.add('active');
    });
  });

  // Hue slider
  const hue = document.getElementById('hue-slider');
  hue.addEventListener('input', () => {
    const c = `hsl(${hue.value}, 85%, 55%)`;
    document.getElementById('cp-preview-hue').style.background = c;
  });
  document.getElementById('cp-preview-hue').style.background = `hsl(48, 85%, 55%)`;

  // RGB sliders
  ['r','g','b'].forEach(ch => {
    document.getElementById(`rgb-${ch}`).addEventListener('input', () => {
      const r = +document.getElementById('rgb-r').value;
      const g = +document.getElementById('rgb-g').value;
      const b = +document.getElementById('rgb-b').value;
      document.getElementById(`rgb-${ch}-val`).textContent = document.getElementById(`rgb-${ch}`).value;
      document.getElementById('cp-preview-rgb').style.background = `rgb(${r},${g},${b})`;
    });
  });

  // Apply color
  document.getElementById('btn-apply-color').addEventListener('click', () => {
    const activeTab = document.querySelector('.cp-tab.active').dataset.panel;
    let color;
    if (activeTab === 'grade') {
      const sel = document.querySelector('.swatch.selected');
      color = sel ? sel.dataset.color : myColor;
    } else if (activeTab === 'espectro') {
      color = `hsl(${document.getElementById('hue-slider').value}, 85%, 55%)`;
    } else {
      const r = +document.getElementById('rgb-r').value;
      const g = +document.getElementById('rgb-g').value;
      const b = +document.getElementById('rgb-b').value;
      color = `rgb(${r},${g},${b})`;
    }
    applyColor(color, true);
    closeDrawer();
  });

  // BG cards - delegate (built dynamically)
  document.getElementById('bg-grid').addEventListener('click', e => {
    const card = e.target.closest('.bg-card');
    if (!card) return;
    applyBg(card.dataset.bg);
  });

  // Lock/clear
  document.getElementById('btn-lock-clear').addEventListener('click', () => {
    const pw = prompt('Senha para limpar o histórico:');
    if (pw === 'admin') {
      if (confirm('Limpar todo o histórico?')) clearHistory();
    } else if (pw !== null) {
      alert('Senha incorreta.');
    }
  });

  // Send
  document.getElementById('send-btn').addEventListener('click', sendMessage);
  // Impede que o botão de enviar tire o foco do textarea (fechava o teclado no iOS).
  // OBS: só no mousedown — preventDefault em touchstart cancela o click sintético
  // no Safari mobile e o botão parava de funcionar no toque.
  document.getElementById('send-btn').addEventListener('mousedown', e => e.preventDefault());
  // Enter sempre quebra linha (comportamento padrão do textarea);
  // o envio agora é só pelo botão, permitindo mensagens com várias linhas.

  // Camera / gallery
  document.getElementById('camera-btn').addEventListener('click', () => {
    document.getElementById('camera-input').click();
  });
  document.getElementById('camera-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => sendImage(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  // Paste image
  document.addEventListener('paste', e => {
    if (!myNome) return;
    const item = Array.from(e.clipboardData.items).find(i => i.type.startsWith('image'));
    if (!item) return;
    const blob = item.getAsFile();
    const reader = new FileReader();
    reader.onload = ev => sendImage(ev.target.result);
    reader.readAsDataURL(blob);
  });

  // Emoji
  document.getElementById('emoji-btn').addEventListener('click', e => {
    e.stopPropagation();
    const panel = document.getElementById('emoji-panel');
    const willOpen = !panel.classList.contains('open');
    panel.classList.toggle('open');
    if (willOpen) {
      // Ao abrir o painel, tira o foco do textarea pra não abrir o teclado
      // por cima dele no celular.
      document.getElementById('msg-input').blur();
    } else {
      document.getElementById('msg-input').focus();
    }
  });
  document.addEventListener('click', e => {
    const panel = document.getElementById('emoji-panel');
    if (!e.target.closest('#emoji-panel') && !e.target.closest('#emoji-btn')) {
      if (panel.classList.contains('open')) {
        panel.classList.remove('open');
      }
    }
  });

  // Emoji tabs
  document.querySelectorAll('.ep-tab').forEach(tab => {
    tab.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.ep-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderEmojiCat(tab.dataset.cat);
    });
  });

  // Audio recorder
  document.getElementById('audio-btn').addEventListener('click', startRecording);
  document.getElementById('rec-pause-btn').addEventListener('click', togglePause);
  document.getElementById('rec-delete-btn').addEventListener('click', cancelRecording);

  // Reply preview
  document.getElementById('reply-bar-close').addEventListener('click', closeReply);

  // @menção: detecta digitação e navegação no popup
  document.getElementById('msg-input').addEventListener('input', handleMentionInput);
  document.getElementById('msg-input').addEventListener('keydown', e => {
    const popup = document.getElementById('mention-popup');
    if (!popup.classList.contains('open')) return;
    const items = Array.from(popup.querySelectorAll('.mention-item'));
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      mentionSelIdx = (mentionSelIdx + 1) % items.length;
      updateMentionSelection(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      mentionSelIdx = (mentionSelIdx - 1 + items.length) % items.length;
      updateMentionSelection(items);
    } else if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      items[mentionSelIdx].click();
    } else if (e.key === 'Escape') {
      closeMentionPopup();
    }
  });

  // Edit overlay
  document.getElementById('btn-cancel-edit').addEventListener('click', closeEdit);
  document.getElementById('edit-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('edit-overlay')) closeEdit();
  });
  document.getElementById('btn-save-edit').addEventListener('click', saveEdit);
}

/* ────────────────────────────────────────────────────────────
   ENTRAR / SAIR
──────────────────────────────────────────────────────────── */
function entrar(nome, apelido) {
  myNome    = nome;
  myApelido = apelido;
  localStorage.setItem('cz_nome',    nome);
  localStorage.setItem('cz_apelido', apelido);
  localStorage.setItem('cz_seed',    mySeed);
  if (myAvatar) localStorage.setItem('cz_avatar', myAvatar);

  document.getElementById('tb-nick').textContent = apelido;
  document.getElementById('tb-name').textContent = nome;
  document.getElementById('tb-avatar').src = myAvatar || dicebear(mySeed);
  document.getElementById('drawer-nick').textContent = apelido;
  document.getElementById('drawer-name').textContent = nome;
  document.getElementById('drawer-avatar').src = myAvatar || dicebear(mySeed);

  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('chat-screen').classList.add('active');

  startChat();
  registerKnownUser();
}

// Grava/atualiza este usuário na coleção "usuarios", para que @menções
// funcionem mesmo quando a pessoa estiver offline.
async function registerKnownUser() {
  if (!window.FirebasePronto) { setTimeout(registerKnownUser, 300); return; }
  try {
    await window.fbSetDoc(window.fbDoc(window.db, 'usuarios', myApelido), {
      apelido   : myApelido,
      nome      : myNome,
      seed      : mySeed,
      avatar    : myAvatar || dicebear(mySeed),
      lastSeen  : window.fbServerTS()
    }, { merge: true });
  } catch (err) {
    console.warn('[Chatzão] falha ao registrar usuário conhecido', err);
  }
}

function subscribeKnownUsers() {
  if (unsubUsers) return;
  unsubUsers = window.fbOnSnapshot(window.fbCollection(window.db, 'usuarios'), snap => {
    knownUsers = snap.docs.map(d => d.data());
  });
}

function sair() {
  if (unsubChat) { unsubChat(); unsubChat = null; }
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  myNome = ''; myApelido = '';
  localStorage.removeItem('cz_nome');
  localStorage.removeItem('cz_apelido');
  document.getElementById('chat-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
  document.getElementById('messages').innerHTML = '';
}

/* ────────────────────────────────────────────────────────────
   FIRESTORE - CHAT
──────────────────────────────────────────────────────────── */
function startChat() {
  if (!window.FirebasePronto) {
    setTimeout(startChat, 200);
    return;
  }
  subscribeKnownUsers();
  const q = window.fbQuery(
    window.fbCollection(window.db, 'mensagens'),
    window.fbOrderBy('timestamp', 'asc')
  );
  unsubChat = window.fbOnSnapshot(q, snap => {
    const container = document.getElementById('messages');
    const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;

    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        renderMsg(change.doc, container);
      } else if (change.type === 'modified') {
        const old = container.querySelector(`[data-id="${change.doc.id}"]`);
        if (old) old.remove();
        renderMsg(change.doc, container, true);
      } else if (change.type === 'removed') {
        const old = container.querySelector(`[data-id="${change.doc.id}"]`);
        if (old) old.remove();
        // Show deleted flash only first time
        if (!seenDeleted.has(change.doc.id)) {
          seenDeleted.add(change.doc.id);
          showDeletedFlash(container, change.doc.id);
        }
      }
    });

    // Re-sort by data attribute (timestamp as string for ordering)
    const msgs = Array.from(container.querySelectorAll('[data-ts]'));
    msgs.sort((a,b) => a.dataset.ts.localeCompare(b.dataset.ts));
    msgs.forEach(m => container.appendChild(m));

    if (wasAtBottom) container.scrollTop = container.scrollHeight;
  });
}

function renderMsg(docSnap, container, modified = false) {
  const d = docSnap.data();
  if (!d.timestamp) return; // pending

  const isMine = d.usuario === myApelido;
  const hora = d.timestamp.toDate().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  const wrap = document.createElement('div');
  wrap.dataset.id = docSnap.id;
  wrap.dataset.ts = d.timestamp.seconds + '_' + d.timestamp.nanoseconds;

  if (d.type === 'system') {
    wrap.className = 'sys-msg';
    wrap.textContent = d.text;
    container.appendChild(wrap);
    return;
  }

  wrap.className = `msg ${isMine ? 'mine' : 'theirs'}`;

  const mentionsMe = mentionsUser(d.texto || '', myApelido);

  let contentHtml = '';
  if (d.image) {
    contentHtml = `<img src="${d.image}" alt="imagem">`;
  } else if (d.audio) {
    contentHtml = `<audio controls src="${d.audio}"></audio>`;
  } else {
    contentHtml = renderTextWithMentions(d.texto || '');
  }
  if (d.edited) contentHtml += ` <span class="msg-edited">(editado)</span>`;

  const quoteHtml = d.replyTo ? `
    <div class="msg-reply-quote" data-jump="${escAttr(d.replyTo.id)}">
      <div class="msg-reply-quote-accent"></div>
      <div class="msg-reply-quote-body">
        <span class="msg-reply-quote-user">${escHtml(d.replyTo.usuario)}</span>
        <span class="msg-reply-quote-text">${escHtml(d.replyTo.texto || '')}</span>
      </div>
    </div>` : '';

  const senderHtml = !isMine ? `
    <div class="msg-sender">
      <img src="${d.avatar || dicebear(d.seed||'x')}" alt="">
      <span>${escHtml(d.usuario)}</span>
    </div>` : '';

  wrap.innerHTML = `
    ${senderHtml}
    <div class="bubble${mentionsMe ? ' mentioned-me' : ''}" data-doc="${docSnap.id}" data-text="${escAttr(d.texto||'')}" data-mine="${isMine}" data-usuario="${escAttr(d.usuario||'')}">
      ${quoteHtml}
      ${contentHtml}
    </div>
    <div class="msg-meta">${hora}</div>
  `;

  // Click no quote → pula até a mensagem original
  if (d.replyTo) {
    wrap.querySelector('.msg-reply-quote').addEventListener('click', e => {
      e.stopPropagation();
      jumpToMessage(d.replyTo.id);
    });
  }

  // Click na bolha → menu (Responder sempre; Editar/Apagar só se for minha e não for mídia)
  const bubble = wrap.querySelector('.bubble');
  bubble.addEventListener('click', e => {
    e.stopPropagation();
    openMsgMenu(e, {
      docId   : docSnap.id,
      texto   : d.texto || '',
      usuario : d.usuario,
      isMine  : isMine,
      isMedia : !!(d.image || d.audio)
    });
  });

  container.appendChild(wrap);
}

function jumpToMessage(docId) {
  const target = document.querySelector(`[data-id="${docId}"]`);
  if (!target) return;
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const b = target.querySelector('.bubble');
  if (b) {
    b.classList.remove('flash-highlight');
    void b.offsetWidth; // reinicia a animação
    b.classList.add('flash-highlight');
  }
}

// Verifica se `texto` contém uma @menção ao apelido informado (palavra inteira)
function mentionsUser(texto, apelido) {
  if (!apelido || !texto) return false;
  const re = new RegExp('(^|\\s)@' + escapeRegex(apelido) + '(?=\\s|$|[.,!?;:])', 'i');
  return re.test(texto);
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Escapa o texto e destaca @menções a usuários conhecidos
function renderTextWithMentions(texto) {
  let html = escHtml(texto);
  if (!knownUsers.length) return html;
  // ordena por tamanho de apelido (maior primeiro) pra evitar match parcial errado
  const nicks = [...new Set(knownUsers.map(u => u.apelido))].sort((a,b) => b.length - a.length);
  nicks.forEach(nick => {
    if (!nick) return;
    const re = new RegExp('(^|\\s)(@' + escapeRegex(escHtml(nick)) + ')(?=\\s|$|[.,!?;:])', 'gi');
    html = html.replace(re, '$1<span class="mention">$2</span>');
  });
  return html;
}

function showDeletedFlash(container, id) {
  const flash = document.createElement('div');
  flash.className = 'msg deleted-flash';
  flash.style.alignSelf = 'center';
  flash.dataset.flashId = id;
  flash.innerHTML = `<div class="bubble" style="min-width:80px;text-align:center;color:#888;font-size:13px;">🗑 Mensagem apagada</div>`;
  container.appendChild(flash);
  container.scrollTop = container.scrollHeight;

  const colors = ['#1a73e8','#E24B4A','#e91e8c','#ffffff','#1DB954'];
  let i = 0;
  const iv = setInterval(() => {
    if (i < colors.length) {
      flash.querySelector('.bubble').style.background = colors[i];
      flash.querySelector('.bubble').style.color = i === 3 ? '#000' : '#fff';
      i++;
    } else {
      clearInterval(iv);
      // fade out
      flash.style.transition = 'opacity 1s';
      flash.style.opacity = '0';
      setTimeout(() => flash.remove(), 1000);
    }
  }, 1000);
}

/* ────────────────────────────────────────────────────────────
   SEND
──────────────────────────────────────────────────────────── */
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const texto = input.value.trim();
  if (!texto || !window.FirebasePronto) return;
  input.value = '';
  input.style.height = 'auto';
  closeMentionPopup();

  const payload = {
    usuario   : myApelido,
    nome      : myNome,
    texto     : texto,
    seed      : mySeed,
    avatar    : myAvatar || dicebear(mySeed),
    color     : myColor,
    timestamp : window.fbServerTS()
  };
  if (replyingTo) payload.replyTo = replyingTo;
  closeReply();

  await window.fbAddDoc(window.fbCollection(window.db, 'mensagens'), payload);
  input.focus();
}

async function sendImage(dataUrl) {
  if (!window.FirebasePronto) return;
  const payload = {
    usuario   : myApelido,
    nome      : myNome,
    image     : dataUrl,
    seed      : mySeed,
    avatar    : myAvatar || dicebear(mySeed),
    timestamp : window.fbServerTS()
  };
  if (replyingTo) payload.replyTo = replyingTo;
  closeReply();
  await window.fbAddDoc(window.fbCollection(window.db, 'mensagens'), payload);
}

async function sendAudio(blob) {
  if (!window.FirebasePronto) return;
  const currentReply = replyingTo;
  closeReply();
  const reader = new FileReader();
  reader.onload = async ev => {
    const payload = {
      usuario   : myApelido,
      nome      : myNome,
      audio     : ev.target.result,
      seed      : mySeed,
      avatar    : myAvatar || dicebear(mySeed),
      timestamp : window.fbServerTS()
    };
    if (currentReply) payload.replyTo = currentReply;
    await window.fbAddDoc(window.fbCollection(window.db, 'mensagens'), payload);
  };
  reader.readAsDataURL(blob);
}

/* ────────────────────────────────────────────────────────────
   MSG MENU (editar / apagar)
──────────────────────────────────────────────────────────── */
let activeMsgMenu = null;

function openMsgMenu(e, info) {
  const { docId, texto, usuario, isMine, isMedia } = info;
  closeMsgMenu();
  const menu = document.createElement('div');
  menu.className = 'msg-menu';

  let btns = `<button class="reply-msg-btn"><i class="ti ti-arrow-back-up"></i> Responder</button>`;
  if (isMine && !isMedia) {
    btns += `
      <button class="edit-msg-btn"><i class="ti ti-pencil"></i> Editar</button>
      <button class="delete-btn"><i class="ti ti-trash"></i> Apagar</button>`;
  } else if (isMine && isMedia) {
    btns += `<button class="delete-btn"><i class="ti ti-trash"></i> Apagar</button>`;
  }
  menu.innerHTML = btns;

  // Position near click
  const bubble = e.currentTarget;
  bubble.style.position = 'relative';
  bubble.appendChild(menu);
  activeMsgMenu = menu;

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', closeMsgMenu, {once: true});
  }, 10);

  menu.querySelector('.reply-msg-btn').addEventListener('click', ev => {
    ev.stopPropagation();
    closeMsgMenu();
    openReply(docId, usuario, texto || (isMedia ? '📎 Anexo' : ''));
  });
  const editBtn = menu.querySelector('.edit-msg-btn');
  if (editBtn) editBtn.addEventListener('click', ev => {
    ev.stopPropagation();
    closeMsgMenu();
    openEdit(docId, texto);
  });
  const delBtn = menu.querySelector('.delete-btn');
  if (delBtn) delBtn.addEventListener('click', async ev => {
    ev.stopPropagation();
    closeMsgMenu();
    await window.fbDeleteDoc(window.fbDoc(window.db, 'mensagens', docId));
  });
}

function closeMsgMenu() {
  if (activeMsgMenu) { activeMsgMenu.remove(); activeMsgMenu = null; }
}

/* ────────────────────────────────────────────────────────────
   CLEAR HISTORY
──────────────────────────────────────────────────────────── */
async function clearHistory() {
  if (!window.FirebasePronto) return;
  const q = window.fbQuery(window.fbCollection(window.db, 'mensagens'), window.fbOrderBy('timestamp','asc'));
  const snap = await new Promise(res => {
    const u = window.fbOnSnapshot(q, s => { res(s); u(); });
  });
  const deletes = snap.docs.map(d => window.fbDeleteDoc(window.fbDoc(window.db, 'mensagens', d.id)));
  await Promise.all(deletes);
  closeDrawer();
}

/* ────────────────────────────────────────────────────────────
   AUDIO RECORDER
──────────────────────────────────────────────────────────── */
async function startRecording() {
  if (recMediaRecorder && recMediaRecorder.state !== 'inactive') {
    // already recording → send
    stopAndSendRecording();
    return;
  }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch {
    alert('Permissão de microfone negada.');
    return;
  }

  recChunks = []; recSeconds = 0; recPaused = false;

  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';

  recMediaRecorder = new MediaRecorder(recStream, mimeType ? {mimeType} : {});
  recMediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  recMediaRecorder.onstop = () => {
    const blob = new Blob(recChunks, {type: recMediaRecorder.mimeType || 'audio/webm'});
    sendAudio(blob);
    recChunks = [];
  };
  recMediaRecorder.start(200);

  // Show recorder UI
  document.getElementById('msg-input').style.display = 'none';
  document.getElementById('audio-recorder').classList.add('active');
  document.getElementById('audio-btn').style.color = '#E24B4A';
  document.getElementById('rec-pause-btn').innerHTML = '<i class="ti ti-player-pause"></i>';

  recTimer = setInterval(() => {
    if (!recPaused) recSeconds++;
    const m = Math.floor(recSeconds/60);
    const s = recSeconds % 60;
    document.getElementById('rec-time').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);

  // Tap send-btn while recording → send
  document.getElementById('send-btn').addEventListener('click', handleSendBtnDuringRec = stopAndSendRecording, {once:true});
}

let handleSendBtnDuringRec = null;

function stopAndSendRecording() {
  if (!recMediaRecorder || recMediaRecorder.state === 'inactive') return;
  recMediaRecorder.stop();
  recStream.getTracks().forEach(t => t.stop());
  stopRecUI();
}

function togglePause() {
  if (!recMediaRecorder) return;
  if (recMediaRecorder.state === 'recording') {
    recMediaRecorder.pause(); recPaused = true;
    document.getElementById('rec-pause-btn').innerHTML = '<i class="ti ti-player-play"></i>';
  } else if (recMediaRecorder.state === 'paused') {
    recMediaRecorder.resume(); recPaused = false;
    document.getElementById('rec-pause-btn').innerHTML = '<i class="ti ti-player-pause"></i>';
  }
}

function cancelRecording() {
  if (recMediaRecorder && recMediaRecorder.state !== 'inactive') {
    recMediaRecorder.ondataavailable = null;
    recMediaRecorder.onstop = null;
    recMediaRecorder.stop();
    recStream.getTracks().forEach(t => t.stop());
  }
  recChunks = [];
  stopRecUI();
}

function stopRecUI() {
  clearInterval(recTimer); recSeconds = 0; recPaused = false;
  document.getElementById('rec-time').textContent = '0:00';
  document.getElementById('audio-recorder').classList.remove('active');
  document.getElementById('msg-input').style.display = '';
  document.getElementById('audio-btn').style.color = '';
  recMediaRecorder = null; recStream = null;
}

/* ────────────────────────────────────────────────────────────
   EMOJI PANEL
──────────────────────────────────────────────────────────── */
let currentSkinTone = '';

function buildEmojiPanel() {
  renderEmojiCat('faces');
}

function renderEmojiCat(cat) {
  const body = document.getElementById('ep-body');
  body.innerHTML = '';

  if (cat === 'faces') {
    const grid = document.createElement('div');
    grid.className = 'ep-grid';
    EMOJI_FACES.forEach(em => {
      const span = document.createElement('span');
      span.className = 'ep-emoji';
      span.textContent = em;
      span.addEventListener('click', e => { e.stopPropagation(); insertEmoji(em); });
      grid.appendChild(span);
    });
    body.appendChild(grid);
  } else {
    const base = cat === 'hands' ? HANDS_BASE : PEOPLE_BASE;

    // Skin tone selector
    const title = document.createElement('div');
    title.className = 'ep-section-title';
    title.textContent = 'Tom de pele';
    body.appendChild(title);

    const skinRow = document.createElement('div');
    skinRow.className = 'ep-skin-row';
    SKIN_TONES.forEach((tone, i) => {
      const btn = document.createElement('span');
      btn.className = 'skin-btn' + (tone === currentSkinTone ? ' active' : '');
      btn.textContent = i === 0 ? '✋' : `✋${tone}`;
      btn.style.borderBottom = tone === currentSkinTone ? '2px solid var(--tp)' : '2px solid transparent';
      btn.addEventListener('click', e => {
        e.stopPropagation();
        currentSkinTone = tone;
        renderEmojiCat(cat);
      });
      skinRow.appendChild(btn);
    });
    body.appendChild(skinRow);

    const grid = document.createElement('div');
    grid.className = 'ep-grid';
    base.forEach(em => {
      const final = applyTone(em, currentSkinTone);
      const span = document.createElement('span');
      span.className = 'ep-emoji';
      span.textContent = final;
      span.addEventListener('click', e => { e.stopPropagation(); insertEmoji(final); });
      grid.appendChild(span);
    });
    body.appendChild(grid);
  }
}

function insertEmoji(em) {
  const inp = document.getElementById('msg-input');
  const pos = inp.selectionStart || inp.value.length;
  inp.value = inp.value.slice(0, pos) + em + inp.value.slice(pos);
  // Painel continua aberto e o textarea NÃO ganha foco de volta aqui —
  // assim o teclado não sobe por cima do painel e dá pra escolher
  // vários emojis seguidos. O foco volta ao fechar o painel.
  const newPos = pos + em.length;
  inp.setSelectionRange(newPos, newPos);
}

/* ────────────────────────────────────────────────────────────
   @MENÇÃO
──────────────────────────────────────────────────────────── */
function handleMentionInput() {
  const inp = document.getElementById('msg-input');
  const pos = inp.selectionStart;
  const before = inp.value.slice(0, pos);
  const match = before.match(/(^|\s)@([a-zA-Z0-9_À-ÿ]*)$/);

  if (!match) { closeMentionPopup(); return; }

  const termo = match[2].toLowerCase();
  mentionQuery = { start: pos - match[2].length - 1, end: pos };

  const matches = knownUsers
    .filter(u => u.apelido && u.apelido.toLowerCase().includes(termo))
    .slice(0, 6);

  if (!matches.length) { closeMentionPopup(); return; }

  renderMentionPopup(matches);
}

function renderMentionPopup(matches) {
  const popup = document.getElementById('mention-popup');
  mentionSelIdx = 0;
  popup.innerHTML = matches.map((u, i) => `
    <div class="mention-item${i === 0 ? ' sel' : ''}" data-apelido="${escAttr(u.apelido)}">
      <img src="${u.avatar || dicebear(u.seed || 'x')}" alt="">
      <div>
        <div class="mention-item-nick">${escHtml(u.apelido)}</div>
        <div class="mention-item-name">${escHtml(u.nome || '')}</div>
      </div>
    </div>
  `).join('');
  popup.querySelectorAll('.mention-item').forEach(item => {
    item.addEventListener('click', () => pickMention(item.dataset.apelido));
  });
  popup.classList.add('open');
}

function updateMentionSelection(items) {
  items.forEach((it, i) => it.classList.toggle('sel', i === mentionSelIdx));
}

function pickMention(apelido) {
  if (!mentionQuery) return;
  const inp = document.getElementById('msg-input');
  const val = inp.value;
  const newVal = val.slice(0, mentionQuery.start) + '@' + apelido + ' ' + val.slice(mentionQuery.end);
  inp.value = newVal;
  const caret = mentionQuery.start + apelido.length + 2;
  inp.focus();
  inp.setSelectionRange(caret, caret);
  closeMentionPopup();
}

function closeMentionPopup() {
  mentionQuery = null;
  document.getElementById('mention-popup').classList.remove('open');
}

/* ────────────────────────────────────────────────────────────
   COLOR
──────────────────────────────────────────────────────────── */
const SWATCHES = [
  '#F4D03F','#FF6B35','#E24B4A','#E91E8C','#AB47BC',
  '#5C6BC0','#29B6F6','#26A69A','#66BB6A','#D4E157',
  '#FFCA28','#FF7043','#EF5350','#EC407A','#7E57C2',
  '#42A5F5','#26C6DA','#2ECC71','#F1C40F','#ffffff',
  '#aaaaaa','#555555','#222222','#000000'
];

function buildSwatches() {
  const grid = document.getElementById('cp-swatches');
  SWATCHES.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.dataset.color = c;
    sw.style.background = c;
    if (c === myColor) sw.classList.add('selected');
    sw.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
    });
    grid.appendChild(sw);
  });
}

function applyColor(color, save) {
  myColor = color;
  document.documentElement.style.setProperty('--tp', color);
  // Determine text color (dark on light, light on dark)
  const lum = getLum(color);
  const textColor = lum > 0.4 ? '#000000' : '#ffffff';
  document.documentElement.style.setProperty('--tp-text', textColor);
  if (save) localStorage.setItem('cz_color', color);
}

function getLum(color) {
  try {
    const c = document.createElement('canvas'); c.width=1; c.height=1;
    const ctx = c.getContext('2d'); ctx.fillStyle = color; ctx.fillRect(0,0,1,1);
    const d = ctx.getImageData(0,0,1,1).data;
    return (0.299*d[0] + 0.587*d[1] + 0.114*d[2]) / 255;
  } catch { return 0.5; }
}

/* ────────────────────────────────────────────────────────────
   BACKGROUNDS
──────────────────────────────────────────────────────────── */
function buildBgGrid() {
  const grid = document.getElementById('bg-grid');
  if (!window.CHATZAO_BG) return;
  window.CHATZAO_BG.forEach((bg, i) => {
    const card = document.createElement('div');
    card.className = 'bg-card';
    card.dataset.bg = String(i);
    card.innerHTML = `
      <img src="${bg.src}" loading="lazy" alt="${bg.label}">
      <div class="bg-card-label">${bg.label}</div>
    `;
    grid.appendChild(card);
  });
}

function applyBg(key) {
  activeBg = key;
  const msgs = document.getElementById('messages');
  document.querySelectorAll('.bg-card').forEach(c => c.classList.remove('active'));
  const target = document.querySelector(`.bg-card[data-bg="${key}"]`);
  if (target) target.classList.add('active');

  if (key === 'none') {
    msgs.style.backgroundImage = '';
  } else {
    const idx = parseInt(key);
    if (window.CHATZAO_BG && window.CHATZAO_BG[idx]) {
      msgs.style.backgroundImage = `url(${window.CHATZAO_BG[idx].src})`;
    }
  }
  applyBgZoom();
  localStorage.setItem('cz_bg', key);
}

// Zoom do plano de fundo — controla o quanto a imagem preenche/corta a área
let bgZoom = parseInt(localStorage.getItem('cz_bg_zoom')) || 150;

function applyBgZoom() {
  document.getElementById('messages').style.backgroundSize = bgZoom + '% ' + bgZoom + '%';
}

function initBgZoom() {
  const slider = document.getElementById('bg-zoom');
  const label  = document.getElementById('bg-zoom-val');
  slider.value = bgZoom;
  label.textContent = bgZoom + '%';
  applyBgZoom();
  slider.addEventListener('input', () => {
    bgZoom = parseInt(slider.value);
    label.textContent = bgZoom + '%';
    applyBgZoom();
    localStorage.setItem('cz_bg_zoom', bgZoom);
  });
}

/* ────────────────────────────────────────────────────────────
   UTILS
──────────────────────────────────────────────────────────── */
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Auto-resize textarea
document.addEventListener('DOMContentLoaded', () => {
  const ta = document.getElementById('msg-input');
  if (ta) {
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
    });
  }
});
</script>
