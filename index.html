<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Chatzão - Geral</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--font-sans:system-ui,-apple-system,sans-serif;--border-radius-md:8px;--border-radius-lg:12px;--theme-primary: #E24B4A;--theme-text: #ffffff;}
    html,body{height:100%;height:100dvh;background:#0e0e0e;overflow:hidden;}
    body{display:flex;flex-direction:column;}
    #app{display:flex;flex-direction:column;flex:1;height:100%;height:100dvh;font-family:var(--font-sans);background:#0e0e0e;overflow:hidden}
    #login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:2rem;background:#0e0e0e}
    #login h2{font-size:20px;font-weight:500;color:#fff;text-align:center}
    #login p{font-size:14px;color:#888;text-align:center;max-width:280px}
    #login input{width:260px;font-size:15px;padding:10px 14px;border-radius:var(--border-radius-md);border:0.5px solid #333;background:#1a1a1a;color:#fff;outline:none}
    #login input:focus{box-shadow:0 0 0 2px rgba(226,75,74,0.33)}
    #login button{width:260px;padding:10px;font-size:15px;font-weight:500;border-radius:var(--border-radius-md);border:none;background:var(--theme-primary);color:var(--theme-text);cursor:pointer}
    #login button:hover{opacity:0.9}
    #login .err{font-size:13px;color:#E24B4A;display:none}
    .avatar-pick{width:72px;height:72px;border-radius:50%;background:#1a1a1a;border:2px dashed #444;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative;transition:border-color 0.2s}
    .avatar-pick:hover{border-color:var(--theme-primary)}
    .avatar-pick img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .av-icon{font-size:24px;color:#555;pointer-events:none}
    .login-row{display:flex;align-items:center;gap:14px;width:260px}
    #chat-area{display:none;flex-direction:column;height:100%;background:#0e0e0e}
    #topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid #222;flex-shrink:0;background:#161616}
    #topbar .title{font-size:15px;font-weight:500;color:#fff;display:flex;align-items:center;gap:6px}
    #topbar .btn-lock-clear{background:none;border:none;color:#aaa;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;padding:4px;transition:color 0.2s;margin-left:4px}
    #topbar .btn-lock-clear:hover{color:#E24B4A}
    #topbar .right{display:flex;align-items:center;gap:12px}
    #topbar .me{font-size:12px;color:#eee;display:flex;align-items:center}
    #topbar .btn-logout{background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;border:0.5px solid #333;padding:4px 10px;border-radius:6px}
    #topbar .btn-logout:hover{color:#E24B4A}
    .pill{font-size:12px;color:#fff;background:#1D9E75;padding:4px 14px;border-radius:99px;font-weight:500;display:flex;align-items:center;gap:5px}
    #messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}
    #messages::-webkit-scrollbar{width:4px}
    #messages::-webkit-scrollbar-track{background:transparent}
    #messages::-webkit-scrollbar-thumb{background:#333;border-radius:99px}
    .msg{display:flex;flex-direction:column;gap:2px;max-width:80%;position:relative}
    .msg.mine{align-self:flex-end;align-items:flex-end}
    .msg.theirs{align-self:flex-start;align-items:flex-start}
    .bubble-wrapper{position:relative;display:flex;align-items:center;gap:6px;width:100%}
    .mine .bubble-wrapper{flex-direction:row-reverse}
    .bubble{padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;word-break:break-word;cursor:pointer;position:relative;white-space:pre-wrap}
    .mine .bubble{background:var(--theme-primary);color:var(--theme-text);border-bottom-right-radius:3px}
    .theirs .bubble{background:#222;color:#fff;border-bottom-left-radius:3px}
    .meta{font-size:11px;color:#555;padding:2px 4px;display:flex;align-items:center;gap:4px}
    .senders{display:flex;align-items:center;gap:5px;margin-bottom:3px;font-size:12px;color:#888;font-weight:500}
    #inputbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#161616;border-top:0.5px solid #222;flex-shrink:0;position:relative}
    #msg-input{flex:1;background:#222;border:0.5px solid #333;border-radius:20px;padding:9px 14px;font-size:14px;color:#fff;outline:none;resize:none;max-height:100px;font-family:var(--font-sans);line-height:1.4}
    #send-btn{background:var(--theme-primary);border:none;color:var(--theme-text);width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:background 0.1s}
    #send-btn:hover{opacity:0.9}
  </style>
</head>
<body>

  <div id="app">
    <div id="login">
      <h2>💬 Chatzão</h2>
      <p>Nome ou Apelido</p>
      <div class="login-row">
        <div class="avatar-pick" id="avatar-pick"><i class="ti ti-camera av-icon"></i></div>
        <div style="display:flex;flex-direction:column;gap:8px;flex:1">
          <input id="name-input" type="text" placeholder="Seu nome..." maxlength="30"/>
          <div id="login-error" class="err">Por favor, digite um nome válido.</div>
          <button id="enter-btn" style="width:100%">Entrar no chat</button>
        </div>
      </div>
    </div>
    
    <div id="chat-area">
      <div id="topbar">
        <span class="title">Chatzão <button class="btn-lock-clear" id="lock-clear-btn"><i class="ti ti-lock"></i></button></span>
        <div class="right">
          <span id="my-name-display" class="me"></span>
          <button class="btn-logout" id="logout-btn">Sair</button>
        </div>
      </div>
      <div id="messages"></div>
      <div id="inputbar">
        <textarea id="msg-input" placeholder="Mensagem..." rows="1"></textarea>
        <button id="send-btn"><i class="ti ti-send"></i></button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, updateDoc, doc, query, orderBy, onSnapshot, writeBatch, getDocs, deleteDoc, arrayUnion, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk",
      authDomain: "chatzao-a27ed.firebaseapp.com",
      projectId: "chatzao-a27ed",
      storageBucket: "chatzao-a27ed.firebasestorage.app",
      messagingSenderId: "923740068926",
      appId: "1:923740068926:web:f4d36655ac6c3460f5056f"
    };

    const app = initializeApp(firebaseConfig);
    
    window.db = getFirestore(app);
    window.collection = collection;
    window.addDoc = addDoc;
    window.updateDoc = updateDoc;
    window.doc = doc;
    window.query = query;
    window.orderBy = orderBy;
    window.onSnapshot = onSnapshot;
    window.writeBatch = writeBatch;
    window.getDocs = getDocs;
    window.deleteDoc = deleteDoc;
    window.arrayUnion = arrayUnion;
    window.limit = limit;
    
    window.FirebasePronto = true;
    console.log("Chatzão: Firebase Ancorado no Window.");
  </script>

  <script src="bg.js"></script>

  <script>
    let usuarioAtual = "";

    function init() {
      console.log("Chatzão: Executando função init(). Inicializando componentes...");
      
      const loginDiv = document.getElementById('login');
      const chatAreaDiv = document.getElementById('chat-area');
      const enterBtn = document.getElementById('enter-btn');
      const nameInput = document.getElementById('name-input');
      const loginError = document.getElementById('login-error');
      const sendBtn = document.getElementById('send-btn');
      const msgInput = document.getElementById('msg-input');
      const messagesContainer = document.getElementById('messages');
      const myNameDisplay = document.getElementById('my-name-display');
      const logoutBtn = document.getElementById('logout-btn');

      // Aplica o background customizado se ele existir no bg.js
      if (window.CHATZAO_BG && window.CHATZAO_BG.anime) {
        document.getElementById('app').style.background = window.CHATZAO_BG.anime;
        loginDiv.style.background = "transparent";
        chatAreaDiv.style.background = "transparent";
      }

      // 1. Lógica de Login
      enterBtn.addEventListener('click', () => {
        const nome = nameInput.value.trim();
        if (nome.length < 2) {
          loginError.style.display = 'block';
          return;
        }
        loginError.style.display = 'none';
        usuarioAtual = nome;
        myNameDisplay.textContent = nome;
        
        loginDiv.style.display = 'none';
        chatAreaDiv.style.display = 'flex';
        
        conectarChatRealtime();
      });

      // Permite dar 'Enter' no input de login
      nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') enterBtn.click();
      });

      // 2. Lógica de envio de mensagem
      async function enviarMensagem() {
        const texto = msgInput.value.trim();
        if (!texto) return;

        msgInput.value = "";
        
        try {
          if (window.FirebasePronto) {
            await window.addDoc(window.collection(window.db, "mensagens"), {
              usuario: usuarioAtual,
              texto: texto,
              timestamp: Date.now()
            });
          }
        } catch (erro) {
          console.error("Erro ao enviar mensagem para o Firebase: ", erro);
        }
      }

      sendBtn.addEventListener('click', enviarMensagem);
      msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          enviarMensagem();
        }
      });

      // 3. Ouvir o Firebase em tempo real (Realtime Listener)
      function conectarChatRealtime() {
        if (!window.FirebasePronto) {
          console.error("Firebase não está pronto ainda.");
          return;
        }

        const q = window.query(
          window.collection(window.db, "mensagens"),
          window.orderBy("timestamp", "asc")
        );

        window.onSnapshot(q, (snapshot) => {
          messagesContainer.innerHTML = "";
          
          snapshot.forEach((docSnap) => {
            const dados = docSnap.data();
            const ehMinha = dados.usuario === usuarioAtual;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${ehMinha ? 'mine' : 'theirs'}`;
            
            // Layout da Mensagem
            msgDiv.innerHTML = `
              ${!ehMinha ? `<div class="senders">${dados.usuario}</div>` : ''}
              <div class="bubble-wrapper">
                <div class="bubble">${dados.texto}</div>
              </div>
            `;
            
            messagesContainer.appendChild(msgDiv);
          });
          
          // Rola para a última mensagem automaticamente
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
      }

      // 4. Botão Sair
      logoutBtn.addEventListener('click', () => {
        chatAreaDiv.style.display = 'none';
        loginDiv.style.display = 'flex';
        nameInput.value = "";
      });
    }

    // Gerenciador de Inicialização de segurança (Trata carregamento assíncrono)
    window.addEventListener('load', () => {
      setTimeout(() => {
        init();
        console.log("Chatzão: Sistema de chat inicializado com sucesso.");
      }, 150);
    });
  </script>
</body>
</html>
