<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatzão V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0e0e0e;
            --bg-panel: #1a1a1a;
            --primary-yellow: #fcd535; /* Essa cor agora muda dinamicamente! */
            --text-light: #ffffff;
            --text-muted: #888888;
            --online-green: #00ff00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text-light); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .screen { display: none; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        /* --- LOGIN --- */
        #login-screen { justify-content: center; align-items: center; padding: 20px; }
        .login-box { width: 100%; max-width: 350px; background: var(--bg-panel); padding: 30px; border-radius: 15px; display: flex; flex-direction: column; gap: 15px; text-align: center; }
        .login-box h1 { color: var(--primary-yellow); margin-bottom: 10px; }
        .login-box input { width: 100%; padding: 15px; border: 1px solid #333; background: #222; color: white; border-radius: 8px; font-size: 16px; }
        .login-box button { width: 100%; padding: 15px; background: var(--primary-yellow); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* --- CHAT --- */
        .chat-header { background: var(--bg-panel); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2a2a; }
        .header-left, .header-right { display: flex; align-items: center; gap: 15px; color: var(--text-muted); font-size: 20px; }
        .header-center { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary-yellow); background: #333; display: flex; align-items: center; justify-content: center; }
        .user-titles { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; font-size: 14px; color: var(--text-light); }
        .user-sub { font-size: 12px; color: var(--text-muted); }
        .btn-sair { background: transparent; border: 1px solid #333; color: var(--text-muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; gap: 5px; align-items: center;}
        .online-indicator { width: 10px; height: 10px; background-color: var(--online-green); border-radius: 50%; }

        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-size: cover; background-position: center; position: relative; }
        
        .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-wrap: break-word; min-width: 100px; }
        .message.mine { background: var(--bg-panel); color: white; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #333; }
        .message.other { background: #222; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-author { font-size: 11px; color: var(--primary-yellow); margin-bottom: 4px; font-weight: bold; }
        .msg-time { font-size: 10px; color: #888; text-align: right; margin-top: 5px; display: block; }

        .chat-footer { background: var(--bg-panel); padding: 10px 15px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #2a2a2a; position: relative; }
        .icon-btn { color: var(--primary-yellow); font-size: 22px; cursor: pointer; background: none; border: none; }
        .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; background: #2a2a2a; border: none; border-radius: 20px; padding: 12px 15px; color: white; font-size: 15px; outline: none; }
        .btn-send { background: var(--primary-yellow); color: black; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; }

        /* --- EMOJI PICKER --- */
        #emoji-picker { display: none; position: absolute; bottom: 60px; right: 50px; background: #222; border: 1px solid #444; border-radius: 10px; padding: 10px; max-width: 250px; flex-wrap: wrap; gap: 10px; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); z-index: 100; }
        #emoji-picker.active { display: flex; }
        .emoji { font-size: 24px; cursor: pointer; transition: transform 0.1s; }
        .emoji:hover { transform: scale(1.2); }

        /* --- CONFIGURAÇÕES --- */
        #config-screen { background: var(--bg-dark); overflow-y: auto; padding-bottom: 20px; }
        .config-header { display: flex; align-items: center; padding: 20px; border-bottom: 1px solid #2a2a2a; gap: 15px; }
        .btn-back { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .config-section { padding: 20px; border-bottom: 1px solid #2a2a2a; }
        .section-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        #theme-color { width: 100%; height: 50px; border: none; border-radius: 8px; cursor: pointer; background: transparent; }

        .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .bg-card { background: #222; border-radius: 12px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 10px; font-size: 12px; font-weight: bold; cursor: pointer; border: 2px solid transparent; }
        .bg-card.selected { border-color: var(--primary-yellow); }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>Chatzão</h1>
            <input type="text" id="login-name" placeholder="Seu Nome Real">
            <input type="text" id="login-nick" placeholder="Apelido no Chat">
            <button id="btn-entrar">Entrar</button>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <header class="chat-header">
            <div class="header-left">
                <i class="fa-solid fa-bars" id="btn-open-config" style="cursor:pointer;"></i>
            </div>
            <div class="header-center">
                <div class="user-avatar"><i class="fa-solid fa-user" style="color:#aaa;"></i></div>
                <div class="user-titles">
                    <span class="user-name" id="display-nick">Nome</span>
                    <span class="user-sub" id="display-name">Subnome</span>
                </div>
            </div>
            <div class="header-right">
                <button class="btn-sair" id="btn-sair"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</button>
                <div class="online-indicator"></div>
            </div>
        </header>

        <div id="chat-window"></div>

        <div class="chat-footer">
            <button class="icon-btn" onclick="alert('Áudio: Em breve implementaremos o gravador de voz!')"><i class="fa-solid fa-microphone"></i></button>
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Mensagem..." autocomplete="off">
            </div>
            <button class="icon-btn" id="btn-emoji"><i class="fa-regular fa-face-smile"></i></button>
            
            <input type="file" id="camera-input" accept="image/*" style="display: none;">
            <button class="icon-btn" onclick="document.getElementById('camera-input').click()"><i class="fa-solid fa-camera"></i></button>
            
            <button class="btn-send" id="btn-send"><i class="fa-solid fa-paper-plane"></i></button>

            <div id="emoji-picker">
                <span class="emoji">😀</span> <span class="emoji">😂</span> <span class="emoji">😍</span> 
                <span class="emoji">😎</span> <span class="emoji">🤔</span> <span class="emoji">🔥</span>
                <span class="emoji">👍</span> <span class="emoji">❤️</span> <span class="emoji">🎉</span>
                <span class="emoji">👀</span> <span class="emoji">✅</span> <span class="emoji">❌</span>
            </div>
        </div>
    </div>

    <div id="config-screen" class="screen">
        <div class="config-header">
            <button class="btn-back" id="btn-back-chat"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>Configurações</h2>
        </div>

        <div class="config-section">
            <div class="section-title"><i class="fa-solid fa-palette"></i> Cor do Tema Real</div>
            <input type="color" id="theme-color" value="#fcd535">
        </div>

        <div class="config-section">
            <div class="section-title"><i class="fa-solid fa-image"></i> Plano de Fundo</div>
            <div class="bg-grid">
                <div class="bg-card selected" onclick="mudarFundo(this, 'none')">Padrão</div>
                <div class="bg-card" onclick="mudarFundo(this, 'url(https://i.imgur.com/link_do_seu_fundo.jpg)')">Fundo 1</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk",
            authDomain: "chatzao-a27ed.firebaseapp.com",
            databaseURL: "https://chatzao-a27ed-default-rtdb.firebaseio.com",
            projectId: "chatzao-a27ed",
            storageBucket: "chatzao-a27ed.firebasestorage.app",
            messagingSenderId: "923740068926",
            appId: "1:923740068926:web:f4d36655ac6c3460f5056f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const telaLogin = document.getElementById('login-screen');
        const telaChat = document.getElementById('chat-screen');
        const telaConfig = document.getElementById('config-screen');
        const chatWindow = document.getElementById('chat-window');
        const inputMsg = document.getElementById('msg-input');
        
        let usuarioAtual = "";

        // Navegação e Login
        document.getElementById('btn-entrar').addEventListener('click', () => {
            const nome = document.getElementById('login-name').value.trim();
            const nick = document.getElementById('login-nick').value.trim();
            if(nome && nick) {
                usuarioAtual = nick;
                document.getElementById('display-nick').innerText = nick;
                document.getElementById('display-name').innerText = nome;
                telaLogin.classList.remove('active');
                telaChat.classList.add('active');
                carregarMensagens();
            } else {
                alert("Preencha nome e apelido!");
            }
        });

        document.getElementById('btn-sair').addEventListener('click', () => {
            telaChat.classList.remove('active');
            telaLogin.classList.add('active');
        });

        document.getElementById('btn-open-config').addEventListener('click', () => {
            telaChat.classList.remove('active');
            telaConfig.classList.add('active');
        });

        document.getElementById('btn-back-chat').addEventListener('click', () => {
            telaConfig.classList.remove('active');
            telaChat.classList.add('active');
        });

        // 1. MUDANÇA DE COR REAL
        document.getElementById('theme-color').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--primary-yellow', e.target.value);
        });

        // Fundos (preparado para links reais)
        window.mudarFundo = (elemento, imagemUrl) => {
            document.querySelectorAll('.bg-card').forEach(c => c.classList.remove('selected'));
            elemento.classList.add('selected');
            document.getElementById('chat-window').style.backgroundImage = imagemUrl;
        };

        // 2. PAINEL DE EMOJIS
        const emojiPicker = document.getElementById('emoji-picker');
        document.getElementById('btn-emoji').addEventListener('click', () => {
            emojiPicker.classList.toggle('active');
        });

        document.querySelectorAll('.emoji').forEach(emoji => {
            emoji.addEventListener('click', (e) => {
                inputMsg.value += e.target.innerText;
                emojiPicker.classList.remove('active'); // Fecha após clicar
                inputMsg.focus();
            });
        });

        // Fechar emoji clicando fora
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#btn-emoji') && !e.target.closest('#emoji-picker')) {
                emojiPicker.classList.remove('active');
            }
        });

        // 3. ENVIO E HORA REAL
        const enviarMensagem = async () => {
            const texto = inputMsg.value.trim();
            if (texto !== "") {
                inputMsg.value = "";
                emojiPicker.classList.remove('active');
                await addDoc(collection(db, "mensagens"), {
                    texto: texto,
                    usuario: usuarioAtual,
                    timestamp: serverTimestamp() // Pega a hora do servidor
                });
            }
        };

        document.getElementById('btn-send').addEventListener('click', enviarMensagem);
        inputMsg.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensagem();
        });

        function carregarMensagens() {
            const q = query(collection(db, "mensagens"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                chatWindow.innerHTML = ''; 
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMine = msg.usuario === usuarioAtual;
                    
                    // Formata a hora do Firebase (se já estiver processada)
                    let horaFormatada = "";
                    if (msg.timestamp) {
                        const dataReal = msg.timestamp.toDate();
                        horaFormatada = dataReal.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    }

                    const div = document.createElement('div');
                    div.className = `message ${isMine ? 'mine' : 'other'}`;
                    
                    const autorHTML = isMine ? '' : `<div class="msg-author">${msg.usuario}</div>`;
                    const horaHTML = `<span class="msg-time">${horaFormatada}</span>`;
                    
                    div.innerHTML = `${autorHTML}${msg.texto}${horaHTML}`;
                    chatWindow.appendChild(div);
                });
                chatWindow.scrollTop = chatWindow.scrollHeight;
            });
        }
    </script>
</body>
</html>
