<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Chatzão - Geral</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --font-sans:system-ui,-apple-system,sans-serif;
      --border-radius-md:8px;
      --border-radius-lg:12px;
      --theme-primary: #E24B4A;
      --theme-text: #ffffff;
    }
    html,body{height:100%;height:100dvh;background:#0e0e0e;overflow:hidden;}
    body{display:flex;flex-direction:column;}
    #app{display:flex;flex-direction:column;flex:1;height:100%;height:100dvh;font-family:var(--font-sans);background:#0e0e0e;overflow:hidden}
    #login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:2rem;background:#0e0e0e}
    #login h2{font-size:20px;font-weight:500;color:#fff;text-align:center}
    #login p{font-size:14px;color:#888;text-align:center;max-width:280px}
    #login input{width:260px;font-size:15px;padding:10px 14px;border-radius:var(--border-radius-md);border:0.5px solid #333;background:#1a1a1a;color:#fff;outline:none}
    #login input:focus{box-shadow:0 0 0 2px rgba(226,75,74,0.33)}
    #login button{width:260px;padding:10px;font-size:15px;font-weight:500;border-radius:var(--border-radius-md);border:none;background:var(--theme-primary);color:var(--theme-text);cursor:pointer}
    #login button:hover{opacity:0.9}
    #login .err{font-size:13px;color:#E24B4A;display:none}
    .avatar-pick{width:72px;height:72px;border-radius:50%;background:#1a1a1a;border:2px dashed #444;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative;transition:border-color 0.2s}
    .avatar-pick:hover{border-color:var(--theme-primary)}
    .avatar-pick img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .av-icon{font-size:24px;color:#555;pointer-events:none}
    .login-row{display:flex;align-items:center;gap:14px;width:260px}

    #chat-area{display:none;flex-direction:column;height:100%;background:#0e0e0e}
    #topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid #222;flex-shrink:0;background:#161616}
    #topbar .title{font-size:15px;font-weight:500;color:#fff;display:flex;align-items:center;gap:6px}
    #topbar .btn-action{background:none;border:none;color:#aaa;cursor:pointer;font-size:18px;display:inline-flex;align-items:center;padding:6px;transition:color 0.2s;border-radius:6px}
    #topbar .btn-action:hover{color:#E24B4A;background:#222}
    #topbar .right{display:flex;align-items:center;gap:12px}
    #topbar .me{font-size:12px;color:#eee;display:flex;align-items:center}
    #topbar .btn-logout{background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;border:0.5px solid #333;padding:4px 10px;border-radius:6px}
    #topbar .btn-logout:hover{color:#E24B4A}
    .pill{font-size:12px;color:#fff;background:#1D9E75;padding:4px 14px;border-radius:99px;font-weight:500;display:flex;align-items:center;gap:5px}
    
    /* Área de mensagens com suporte a Background customizável */
    #messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-height:0;background-position:center;background-size:cover;background-repeat:no-repeat;position:relative}
    #messages::-webkit-scrollbar{width:4px}
    #messages::-webkit-scrollbar-track{background:transparent}
    #messages::-webkit-scrollbar-thumb{background:#333;border-radius:99px}
    
    .msg{display:flex;flex-direction:column;gap:2px;max-width:80%;position:relative}
    .msg.mine{align-self:flex-end;align-items:flex-end}
    .msg.theirs{align-self:flex-start;align-items:flex-start}
    .bubble-wrapper{position:relative;display:flex;align-items:center;gap:6px;width:100%}
    .mine .bubble-wrapper{flex-direction:row-reverse}
    .bubble{padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;word-break:break-word;cursor:pointer;position:relative;white-space:pre-wrap;background:#1a1a1a;color:#fff;border:0.5px solid #252525}
    .mine .bubble{border-bottom-right-radius:3px;background:var(--theme-primary);color:var(--theme-text);border:none}
    .theirs .bubble{border-bottom-left-radius:3px}
    .bubble img{max-width:180px;max-height:140px;border-radius:8px;display:block}
    .bubble audio{display:block;max-width:240px;outline:none;margin:4px 0}
    
    /* Menus e Modais */
    .color-popup{position:fixed;top:60px;right:14px;background:#161616;border:0.5px solid #333;border-radius:var(--border-radius-lg);padding:14px;display:none;flex-direction:column;gap:12px;z-index:100;box-shadow:0 10px 25px rgba(0,0,0,0.6);width:240px}
    .color-popup.open{display:flex}
    .color-popup h4{font-size:13px;color:#888;font-weight:500;margin-bottom:2px}
    .color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.1s}
    .color-dot:hover{transform:scale(1.1)}
    .color-dot.active{border-color:#fff}
    
    .btn-bg-trigger{width:100%;padding:8px;background:#222;border:0.5px solid #333;border-radius:6px;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
    .btn-bg-trigger:hover{background:#2a2a2a;color:var(--theme-primary)}

    /* Painel do Plano de Fundo */
    .bg-popup{position:fixed;top:60px;right:14px;background:#161616;border:0.5px solid #333;border-radius:var(--border-radius-lg);padding:14px;display:none;flex-direction:column;gap:12px;z-index:101;box-shadow:0 10px 25px rgba(0,0,0,0.6);width:260px}
    .bg-popup.open{display:flex}
    .bg-popup h4{font-size:13px;color:#888;font-weight:500}
    .bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:160px;overflow-y:auto}
    .bg-thumb{width:100%;height:50px;border-radius:4px;cursor:pointer;object-fit:cover;border:1.5px solid transparent;background:#222}
    .bg-thumb:hover{opacity:0.8}
    .bg-thumb.active{border-color:var(--theme-primary)}
    .bg-actions{display:flex;gap:6px}
    .btn-bg-action{flex:1;padding:8px;font-size:12px;border-radius:6px;cursor:pointer;border:none;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px}
    .btn-bg-gallery{background:var(--theme-primary);color:#fff}
    .btn-bg-clear{background:#222;color:#aaa;border:0.5px solid #333}

    /* Caixa de entrada */
    #input-area{padding:12px 14px;background:#161616;border-top:0.5px solid #222;display:flex;align-items:center;gap:10px;position:relative}
    #input-area input{flex:1;background:#222;border:0.5px solid #333;border-radius:20px;padding:10px 16px;color:#fff;font-size:14px;outline:none}
    #input-area input:focus{border-color:#444}
    #btn-send{background:var(--theme-primary);color:var(--theme-text);border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
    
    .meta{font-size:10px;color:#555;margin-top:2px;display:flex;gap:4px}
    .senders{font-size:12px;color:#aaa;font-weight:500;margin-bottom:2px}
  </style>
</head>
<body>

  <div id="app">
    <div id="login">
      <h2>Entrar no Chatzão</h2>
      <p>Configure seu apelido e perfil para começar.</p>
      <div class="login-row">
        <div class="avatar-pick" id="avatar-pick" onclick="triggerAvatarUpload()">
          <i class="ti ti-camera av-icon" id="camera-ic"></i>
        </div>
        <input type="text" id="name-input" placeholder="Seu apelido..." maxlength="25">
      </div>
      <input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="handleAvatarFile(this)">
      <button onclick="entrar()">Conectar</button>
      <div class="err" id="login-err">Insira um apelido válido!</div>
    </div>

    <div id="chat-area">
      <div id="topbar">
        <div class="title">
          <span class="pill"><i class="ti ti-circle-filled" style="font-size:8px"></i> Chatzão</span>
        </div>
        <div class="right">
          <span class="me" id="user-display"></span>
          <button class="btn-action" onclick="toggleColorPopup(event)" title="Cores do Sistema">
            <i class="ti ti-palette"></i>
          </button>
          <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
      </div>

      <div class="color-popup" id="color-popup" onclick="event.stopPropagation()">
        <h4>Cor Principal</h4>
        <div class="color-grid" id="color-grid"></div>
        <hr style="border:0; border-top:0.5px solid #333; margin:4px 0;">
        <button class="btn-bg-trigger" onclick="openBgPopup(event)">
          <i class="ti ti-photo"></i> Plano de Fundo
        </button>
      </div>

      <div class="bg-popup" id="bg-popup" onclick="event.stopPropagation()">
        <h4>Fotos Neutras de Fundo</h4>
        <div class="bg-grid" id="bg-grid"></div>
        <input type="file" id="bg-gallery-input" accept="image/*" style="display:none" onchange="handleBgGallery(this)">
        <div class="bg-actions">
          <button class="btn-bg-action btn-bg-gallery" onclick="triggerBgGallery()">
            <i class="ti ti-folder"></i> Galeria
          </button>
          <button class="btn-bg-action btn-bg-clear" onclick="clearBg()">
            Sem Fundo
          </button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="input-area">
        <input type="text" id="msg-input" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter') enviarMsg()">
        <button id="btn-send" onclick="enviarMsg()"><i class="ti ti-send"></i></button>
      </div>
    </div>
  </div>

  <script>
    let meuNome = "";
    let meuAvatar = "";
    
    const cores = ['#E24B4A', '#2673DD', '#1D9E75', '#E2A11F', '#8E44AD', '#E67E22', '#1ABC9C', '#34495E', '#7F8C8D', '#2ECC71'];
    // Fotos neutras selecionadas para o chat
    const fundosPadrao = [
      'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=60', // Ondas escuras suaves
      'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=400&auto=format&fit=crop&q=60', // Degradê cinza escuro
      'https://images.unsplash.com/photo-1557683316-973673baf926?w=400&auto=format&fit=crop&q=60', // Linhas fluidas escuras
      'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&auto=format&fit=crop&q=60', // Areia/Praia minimalista suave
      'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=400&auto=format&fit=crop&q=60', // Folhas escuras discretas
      'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=400&auto=format&fit=crop&q=60'  // Geométrico abstrato macio
    ];

    window.addEventListener('DOMContentLoaded', () => {
      renderCores();
      renderFundos();
      carregarConfigSalvas();
    });

    function triggerAvatarUpload() { document.getElementById('avatar-file').click(); }
    
    function handleAvatarFile(input) {
      if(input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          meuAvatar = e.target.result;
          document.getElementById('avatar-pick').innerHTML = `<img src="${meuAvatar}" />`;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function entrar() {
      const input = document.getElementById('name-input').value.trim();
      if(!input) {
        document.getElementById('login-err').style.display = 'block';
        return;
      }
      meuNome = input;
      localStorage.setItem('chatzao_nome', meuNome);
      if(meuAvatar) localStorage.setItem('chatzao_avatar', meuAvatar);
      
      document.getElementById('login').style.display = 'none';
      document.getElementById('chat-area').style.display = 'flex';
      document.getElementById('user-display').textContent = meuNome;
      
      // Adiciona mensagem de boas-vindas do sistema
      const box = document.getElementById('messages');
      box.innerHTML = `<div style="align-self:center; font-size:11px; color:#555; background:#161616; padding:4px 12px; border-radius:99px; border:0.5px solid #222">Você entrou na conversa como ${meuNome}</div>`;
    }

    function logout() {
      localStorage.removeItem('chatzao_nome');
      document.getElementById('login').style.display = 'flex';
      document.getElementById('chat-area').style.display = 'none';
      document.getElementById('name-input').value = '';
    }

    function enviarMsg() {
      const input = document.getElementById('msg-input');
      const texto = input.value.trim();
      if(!texto) return;

      const box = document.getElementById('messages');
      const agora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      
      const msgHtml = `
        <div class="msg mine">
          <div class="bubble-wrapper">
            <div class="bubble">${texto}</div>
          </div>
          <div class="meta"><span>${agora}</span></div>
        </div>
      `;
      
      box.insertAdjacentHTML('beforeend', msgHtml);
      input.value = '';
      box.scrollTop = box.scrollHeight;
    }

    /* SISTEMA DE CORES (PALETA) */
    function toggleColorPopup(e) {
      e.stopPropagation();
      document.getElementById('bg-popup').classList.remove('open');
      document.getElementById('color-popup').classList.toggle('open');
    }

    function renderCores() {
      const grid = document.getElementById('color-grid');
      grid.innerHTML = '';
      cores.forEach(cor => {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = cor;
        dot.onclick = () => mudarCorTema(cor);
        grid.appendChild(dot);
      });
    }

    function mudarCorTema(cor) {
      document.documentElement.style.setProperty('--theme-primary', cor);
      localStorage.setItem('chatzao_cor', cor);
    }

    /* SISTEMA DE PLANO DE FUNDO DO CHAT */
    function openBgPopup(e) {
      e.stopPropagation();
      document.getElementById('color-popup').classList.remove('open');
      document.getElementById('bg-popup').classList.add('open');
    }

    function renderFundos() {
      const grid = document.getElementById('bg-grid');
      grid.innerHTML = '';
      fundosPadrao.forEach(url => {
        const img = document.createElement('img');
        img.className = 'bg-thumb';
        img.src = url;
        img.onclick = () => aplicarFundo(url);
        grid.appendChild(img);
      });
    }

    function triggerBgGallery() { document.getElementById('bg-gallery-input').click(); }

    function handleBgGallery(input) {
      if(input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          aplicarFundo(e.target.result);
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function aplicarFundo(src) {
      const box = document.getElementById('messages');
      box.style.backgroundImage = `url('${src}')`;
      localStorage.setItem('chatzao_fundo', src);
    }

    function clearBg() {
      const box = document.getElementById('messages');
      box.style.backgroundImage = 'none';
      localStorage.removeItem('chatzao_fundo');
    }

    function carregarConfigSalvas() {
      const corSalva = localStorage.getItem('chatzao_cor');
      if(corSalva) document.documentElement.style.setProperty('--theme-primary', corSalva);

      const fundoSalvo = localStorage.getItem('chatzao_fundo');
      if(fundoSalvo) document.getElementById('messages').style.backgroundImage = `url('${fundoSalvo}')`;

      const nomeSalvo = localStorage.getItem('chatzao_nome');
      const avatarSalvo = localStorage.getItem('chatzao_avatar');
      if(nomeSalvo) document.getElementById('name-input').value = nomeSalvo;
      if(avatarSalvo) {
        meuAvatar = avatarSalvo;
        document.getElementById('avatar-pick').innerHTML = `<img src="${avatarSalvo}" />`;
      }
    }

    // Fecha popups clicando fora
    document.addEventListener('click', () => {
      document.getElementById('color-popup').classList.remove('open');
      document.getElementById('bg-popup').classList.remove('open');
    });
  </script>
</body>
</html>
