<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chatzão Oficial</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    /* ── RESET & LAYOUT SEGURO (SEM DIAGONAL SCROLL) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --tp: #F4D03F;
      --tp-text: #000;
      --bg0: #0a0a0a;
      --bg1: #121212;
      --bg2: #1c1c1e;
      --bg3: #2c2c2e;
      --border: #262626;
      --text: #ffffff;
      --muted: #8e8e93;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100dvh; width: 100vw;
      background: var(--bg0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .screen { display: none; height: 100dvh; width: 100vw; flex-direction: column; overflow: hidden; }
    .screen.active { display: flex; }

    /* ── TELA DE LOGIN ── */
    #login-screen { justify-content: center; align-items: center; gap: 20px; background: linear-gradient(145deg, #0f0f0f, #050505); }
    .avatar-wrapper { position: relative; display: inline-block; }
    #avatar-preview { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--tp); object-fit: cover; background: var(--bg2); cursor: pointer; }
    .btn-shuffle { position: absolute; bottom: 0; right: 0; background: var(--tp); color: var(--tp-text); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .login-box { display: flex; flex-direction: column; gap: 12px; width: 280px; }
    .login-input { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg1); color: #fff; font-size: 15px; text-align: center; outline: none; }
    .login-input:focus { border-color: var(--tp); }
    .btn-enter { padding: 14px; background: var(--tp); color: var(--tp-text); font-weight: bold; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; transition: opacity 0.2s; }
    .btn-enter:active { opacity: 0.8; }

    /* ── BARRA SUPERIOR (TOPBAR) ── */
    #topbar { height: 60px; background: var(--bg1); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); z-index: 10; }
    .top-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .top-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--tp); }
    .top-meta { display: flex; flex-direction: column; }
    .top-nick { font-weight: bold; font-size: 14px; color: #fff; }
    .top-real { font-size: 11px; color: var(--muted); }
    .btn-icon { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; }
    .btn-icon:active { background: var(--bg2); }

    /* ── JANELA DE MENSAGENS COMPACTA ── */
    #messages { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 10px; background-size: cover; background-position: center; position: relative; }
    .msg-row { display: flex; flex-direction: column; width: 100%; }
    .msg-meta-name { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: flex; align-items: center; gap: 4px; padding-left: 4px; }
    
    .msg-bubble { padding: 8px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; word-wrap: break-word; max-width: 70%; position: relative; cursor: pointer; transition: transform 0.1s; }
    .msg-bubble:active { transform: scale(0.98); }
    .msg-bubble.mine { background: var(--tp); color: var(--tp-text); align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-bubble.other { background: var(--bg2); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-time { font-size: 9px; opacity: 0.6; float: right; margin-top: 6px; margin-left: 8px; }

    /* Imagens e Áudio na Bolha */
    .msg-media-img { max-width: 100%; max-height: 200px; border-radius: 10px; margin-top: 4px; object-fit: cover; display: block; }
    .audio-player { display: flex; align-items: center; gap: 8px; min-width: 160px; padding: 4px 0; }
    
    /* Reações Integradas */
    .reactions-line { display: flex; flex-wrap: wrap; gap: 3px; margin-top: -4px; margin-bottom: 4px; z-index: 2; }
    .msg-row.mine .reactions-line { align-self: flex-end; }
    .msg-row.other .reactions-line { align-self: flex-start; }
    .react-badge { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 2px 6px; font-size: 10px; color: #fff; cursor: pointer; }

    /* Respostas (WhatsApp Style) */
    .reply-quote-box { background: rgba(0,0,0,0.15); border-left: 3px solid rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 6px; color: inherit; }
    .msg-bubble.other .reply-quote-box { background: rgba(255,255,255,0.08); border-left-color: var(--tp); }

    /* ── RODAPÉ & ENTRADA DE TEXTO COMPACTA ── */
    #reply-preview-bar { display: none; background: var(--bg1); padding: 8px 16px; border-left: 4px solid var(--tp); justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    #footer-controls { background: var(--bg1); padding: 8px 8px calc(8px + var(--safe-bottom)) 8px; display: flex; align-items: flex-end; gap: 6px; border-top: 1px solid var(--border); position: relative; }
    .input-box-wrapper { flex: 1; background: var(--bg2); border-radius: 22px; display: flex; align-items: flex-end; padding: 4px 6px; border: 1px solid var(--border); }
    #typed-message { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; resize: none; max-height: 90px; padding: 8px; font-family: inherit; }
    
    /* Microfone / Gravador Visual */
    #voice-record-panel { display: none; flex: 1; align-items: center; justify-content: space-between; background: var(--bg2); height: 38px; border-radius: 19px; padding: 0 12px; color: #fff; font-size: 13px; }
    .recording-dot { width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; animation: pulse 1s infinite; }

    /* ── POPUPS E PANÉIS FLUTUANTES ── */
    /* Menu de Contexto / Reações Clássico */
    .context-popup { position: absolute; background: var(--bg1); border: 1px solid var(--border); border-radius: 16px; padding: 10px; display: none; flex-direction: column; gap: 8px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.6); width: 260px; }
    .react-picker-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--border); text-align: center; font-size: 20px; }
    .react-picker-grid span { cursor: pointer; transition: transform 0.1s; }
    .react-picker-grid span:active { transform: scale(1.3); }
    .context-actions { display: flex; gap: 6px; }
    .context-btn { flex: 1; padding: 8px; border-radius: 8px; border: none; background: var(--bg2); color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; }
    
    /* Popover de Menções */
    #mentions-popover { display: none; position: absolute; bottom: 60px; left: 12px; background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; max-height: 140px; overflow-y: auto; width: 180px; z-index: 60; }
    .mention-row { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .mention-row:hover { background: var(--bg2); color: var(--tp); }

    /* Modal de Imagem Exclusiva (3x4 Aspect) */
    #modal-view-3x4 { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
    #modal-view-3x4 img { width: 75vw; max-width: 320px; height: calc(75vw * 1.33); max-height: 426px; object-fit: cover; border-radius: 12px; border: 2px solid var(--tp); }

    /* ── DRAWER DE PERSONALIZAÇÃO COMPLETO ── */
    #drawer-panel { position: fixed; top: 0; left: -290px; width: 285px; height: 100dvh; background: var(--bg1); border-right: 1px solid var(--border); transition: left 0.25s ease; padding: 20px; z-index: 500; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    #drawer-panel.open { left: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .section-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .theme-card { height: 44px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #000; border: 2px solid transparent; }
    .bg-custom-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 200px; overflow-y: auto; }
    .bg-thumb-card { height: 70px; border-radius: 6px; background: var(--bg2); cursor: pointer; overflow: hidden; border: 2px solid transparent; position: relative; }
    .bg-thumb-card.active { border-color: var(--tp); }
    .bg-thumb-card img { width: 100%; height: 100%; object-fit: cover; }

    /* Temas Prontos Gradientes */
    .t-patrick { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
    .t-lula { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
    .t-homer { background: linear-gradient(135deg, #f6d365, #fda085); }
    .t-marge { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }

    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
  </style>
</head>
<body>

  <div id="modal-view-3x4" onclick="this.style.display='none'">
    <img id="target-modal-img" src="">
  </div>

  <div id="login-screen" class="screen active">
    <div style="text-align: center;">
      <h1 style="color: var(--tp); font-size: 32px; letter-spacing: -1px; margin-bottom: 4px;">Chatzão</h1>
      <p style="color: var(--muted); font-size: 12px; margin-bottom: 24px;">Comunicação Instantânea Corporativa</p>
      
      <div class="avatar-wrapper">
        <img id="avatar-preview" src="" onclick="document.getElementById('upload-avatar-input').click()">
        <button class="btn-shuffle" onclick="gerarAvatarDados()"><i class="ti ti-arrows-shuffle"></i></button>
        <input type="file" id="upload-avatar-input" style="display:none" accept="image/*">
      </div>
    </div>

    <div class="login-box">
      <input type="text" id="login-real-name" class="login-input" placeholder="Nome Completo">
      <input type="text" id="login-nick-name" class="login-input" placeholder="@usuario">
      <button class="btn-enter" onclick="executarLogin()">Conectar ao Chat</button>
    </div>
  </div>

  <div id="chat-screen" class="screen">
    
    <div id="drawer-panel">
      <div class="drawer-header">
        <h3>Aparência</h3>
        <button class="btn-icon" onclick="toggleDrawer(false)"><i class="ti ti-x"></i></button>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <span class="section-label">Temas Rápidos</span>
        <div class="theme-grid">
          <div class="theme-card t-patrick" onclick="aplicarPaletaPreset('#ff9a9e')">Patrick</div>
          <div class="theme-card t-lula" onclick="aplicarPaletaPreset('#a1c4fd')">Lula</div>
          <div class="theme-card t-homer" onclick="aplicarPaletaPreset('#f6d365')">Homer</div>
          <div class="theme-card t-marge" onclick="aplicarPaletaPreset('#e0c3fc')">Marge</div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <span class="section-label">Ajuste Seletivo de Cor</span>
        <input type="color" id="picker-color-native" style="width:100%; height:40px; border:none; background:transparent; cursor:pointer;" oninput="atualizarVariavelCor(this.value)">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <span class="section-label">Planos de Fundo (Wallpapers)</span>
        <div class="bg-custom-grid" id="container-wallpaper-options">
          <div class="bg-thumb-card active" onclick="definirFundoTela('none', this)" id="wp-card-none">
            <div style="display:flex; align-items:center; justify-content:center; height:100%; font-size:11px; color:var(--muted)">Sem Fundo</div>
          </div>
        </div>
      </div>

      <button class="context-btn" style="background:#3a0d0d; color:#ff453a; margin-top:auto;" onclick="limparBancoDadosMestre()">
        <i class="ti ti-trash"></i> Resetar Histórico (Mestre)
      </button>
    </div>

    <div id="topbar">
      <div style="display:flex; align-items:center; gap:4px;">
        <button class="btn-icon" onclick="toggleDrawer(true)"><i class="ti ti-menu-2"></i></button>
        <div class="top-user" id="trigger-profile-view">
          <img class="top-avatar" id="header-avatar" src="">
          <div class="top-meta">
            <span class="top-nick" id="header-nick">@nick</span>
            <span class="top-real" id="header-real">Nome Completo</span>
          </div>
        </div>
      </div>
      <button class="btn-icon" style="color: var(--muted)" onclick="executarLogout()"><i class="ti ti-logout"></i></button>
    </div>

    <div id="messages" onclick="fecharJanelasFlutuantes()"></div>

    <div id="reply-preview-bar">
      <div>
        <span id="reply-preview-user" style="font-size:12px; font-weight:bold; color:var(--tp)">Replying</span>
        <p id="reply-preview-msg" style="font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:250px;"></p>
      </div>
      <button class="btn-icon" style="font-size:16px;" onclick="cancelarModoResposta()"><i class="ti ti-x"></i></button>
    </div>

    <div id="mentions-popover"></div>

    <div id="footer-controls">
      <button class="btn-icon" id="btn-audio-action" onclick="gerenciarFluxoAudio()"><i class="ti ti-microphone" id="mic-icon-state"></i></button>
      
      <div id="voice-record-panel">
        <div style="display:flex; align-items:center; gap:6px;">
          <div class="recording-dot"></div>
          <span id="voice-duration-clock">00:00</span>
        </div>
        <div style="display:flex; gap:10px;">
          <span style="color:#ff453a; cursor:pointer;" onclick="cancelarGravacaoAudio()"><i class="ti ti-trash"></i></span>
          <span style="color:#30d158; cursor:pointer; font-weight:bold;" onclick="concluirEEnviarAudio()"><i class="ti ti-check"></i></span>
        </div>
      </div>

      <div class="input-box-wrapper" id="normal-input-fields">
        <textarea id="typed-message" rows="1" placeholder="Mensagem..."></textarea>
        <button class="btn-icon" style="color:var(--muted)" onclick="document.getElementById('chat-gallery-input').click()"><i class="ti ti-camera"></i></button>
        <input type="file" id="chat-gallery-input" style="display:none" accept="image/*">
      </div>

      <button class="btn-icon" style="background: var(--tp); color: var(--tp-text); flex-shrink:0;" onclick="gerenciarEnvioMensagem()"><i class="ti ti-send"></i></button>
    </div>
  </div>

  <div id="popup-context-master" class="context-popup">
    <div class="react-picker-grid">
      <span onclick="adicionarReacaoMensagem('👍')">👍</span>
      <span onclick="adicionarReacaoMensagem('❤️')">❤️</span>
      <span onclick="adicionarReacaoMensagem('😂')">😂</span>
      <span onclick="adicionarReacaoMensagem('😮')">😮</span>
      <span onclick="adicionarReacaoMensagem('😢')">😢</span>
      <span onclick="adicionarReacaoMensagem('🙏')">🙏</span>
    </div>
    <div class="context-actions">
      <button class="context-btn" id="ctx-btn-reply" onclick="ativarModoRespostaDoContexto()">Responder</button>
      <button class="context-btn" id="ctx-btn-edit" onclick="ativarModoEdicaoDoContexto()">Editar</button>
      <button class="context-btn" id="ctx-btn-delete" style="color:#ff453a" onclick="removerMensagemDoContexto()">Apagar</button>
    </div>
  </div>

  <script src="bg.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, updateDoc, doc, deleteDoc, query, orderBy, onSnapshot, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = { apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk", projectId: "chatzao-a27ed" };
    const db = getFirestore(initializeApp(firebaseConfig));

    let sessaoLocalUsuario = null;
    let listaUsuariosDoPainel = new Set();
    
    let ativoIdMensagemContexto = null;
    let dadosMensagemContexto = null;

    let respostaAtivaObjeto = null;
    let emModoEdicao = false;

    let gravadorMidia = null;
    let fragmentosAudio = [];
    let cronometroAudioInterval = null;
    let segundosGravadosAudio = 0;

    // Inicialização da Sessão
    window.onload = () => {
      const cache = localStorage.getItem('cz_user_session');
      if (cache) {
        sessaoLocalUsuario = JSON.parse(cache);
        carregarConfiguracoesTemaSalvas();
        iniciarFluxoPainelChat();
      } else {
        gerarAvatarDados();
      }
      inicializarListaWallpapersNativos();
    };

    // Gerador randômico de avatar
    window.gerarAvatarDados = () => {
      const seed = Math.floor(Math.random() * 100000);
      document.getElementById('avatar-preview').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}`;
    };

    // Carregar imagem local manualmente
    document.getElementById('upload-avatar-input').onchange = (e) => {
      const arq = e.target.files[0];
      if (arq) {
        const leitor = new FileReader();
        leitor.onload = (ev) => { document.getElementById('avatar-preview').src = ev.target.result; };
        leitor.readAsDataURL(arq);
      }
    };

    // Fluxo de Autenticação Interna
    window.executarLogin = () => {
      const realName = document.getElementById('login-real-name').value.trim();
      let nickName = document.getElementById('login-nick-name').value.trim();
      
      if (!realName || !nickName) return alert("Por favor, preencha todos os campos cadastrais.");
      if (!nickName.startsWith('@')) nickName = '@' + nickName;

      sessaoLocalUsuario = {
        name: realName,
        nick: nickName,
        avatar: document.getElementById('avatar-preview').src
      };

      localStorage.setItem('cz_user_session', JSON.stringify(sessaoLocalUsuario));
      iniciarFluxoPainelChat();
    };

    window.executarLogout = () => {
      localStorage.removeItem('cz_user_session');
      location.reload();
    };

    function iniciarFluxoPainelChat() {
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('chat-screen').classList.add('active');

      document.getElementById('header-avatar').src = sessaoLocalUsuario.avatar;
      document.getElementById('header-nick').innerText = sessaoLocalUsuario.nick;
      document.getElementById('header-real').innerText = sessaoLocalUsuario.name;

      document.getElementById('trigger-profile-view').onclick = () => visualizarImagemModal3x4(sessaoLocalUsuario.avatar);

      escutarBancoDadosModificacoes();
    }

    // ── FIREBASE REALTIME COM SENSATIBILIDADE DOCCHANGES ──
    function escutarBancoDadosModificacoes() {
      const localMsgContainer = document.getElementById('messages');
      const q = query(collection(db, "mensagens"), orderBy("timestamp", "asc"));

      onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          const dados = change.doc.data();
          const docId = change.doc.id;
          
          if (dados.usuario && dados.usuario !== sessaoLocalUsuario.nick) {
            listaUsuariosDoPainel.add(dados.usuario);
          }

          if (change.type === "added") {
            const bolhaDOM = criarElementoBolhaEstruturada(docId, dados);
            localMsgContainer.appendChild(bolhaDOM);
          }
          if (change.type === "modified") {
            const bolhaExistente = document.getElementById(`row-${docId}`);
            if (bolhaExistente) {
              const novaBolha = criarElementoBolhaEstruturada(docId, dados);
              bolhaExistente.replaceWith(novaBolha);
            }
          }
          if (change.type === "removed") {
            const bolhaRemover = document.getElementById(`row-${docId}`);
            if (bolhaRemover) bolhaRemover.remove();
          }
        });
        localMsgContainer.scrollTop = localMsgContainer.scrollHeight;
      });
    }

    // Fábrica Estrutural das Mensagens
    function criarElementoBolhaEstruturada(id, dados) {
      const row = document.createElement('div');
      row.className = 'msg-row';
      row.id = `row-${id}`;

      const eMeu = dados.usuario === sessaoLocalUsuario.nick;
      const horaStr = dados.timestamp ? new Date(dados.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      // Nome do usuário abaixo ou acima da foto de perfil integrada ao clique
      let metaHeader = '';
      if (!eMeu) {
        metaHeader = `
          <div class="msg-meta-name" style="cursor:pointer;" id="click-profile-${id}">
            <img src="${dados.avatar || ''}" style="width:16px; height:16px; border-radius:50%; object-fit:cover;">
            <span>${dados.usuario}</span>
          </div>
        `;
      }

      let replySnippetHTML = '';
      if (dados.replyTo) {
        replySnippetHTML = `
          <div class="reply-quote-box">
            <strong>${dados.replyTo.user}</strong>
            <p>${dados.replyTo.text}</p>
          </div>
        `;
      }

      let conteudoPrincipalHTML = '';
      if (dados.tipo === 'imagem') {
        conteudoPrincipalHTML = `${replySnippetHTML}<img src="${dados.midiaUrl}" class="msg-media-img" onclick="window.open('${dados.midiaUrl}')"><p style="margin-top:4px;">${filtrarTextoMenções(dados.texto)}</p>`;
      } else if (dados.tipo === 'audio') {
        conteudoPrincipalHTML = `
          ${replySnippetHTML}
          <div class="audio-player">
            <i class="ti ti-player-play" style="cursor:pointer;" onclick="var a=new Audio('${dados.midiaUrl}'); a.play();"></i>
            <span style="font-size:11px; opacity:0.8;">Mensagem de Voz</span>
          </div>
        `;
      } else {
        conteudoPrincipalHTML = `${replySnippetHTML}${filtrarTextoMenções(dados.texto)}`;
      }

      let badgeReacoesHTML = '';
      if (dados.reacoes && Object.keys(dados.reacoes).length > 0) {
        badgeReacoesHTML = `<div class="reactions-line">`;
        for (const [emoji, listaNicks] of Object.entries(dados.reacoes)) {
          if (listaNicks.length > 0) {
            badgeReacoesHTML += `<span class="react-badge" onclick="event.stopPropagation(); processarCliqueBadgeReacao('${id}', '${emoji}')">${emoji} ${listaNicks.length}</span>`;
          }
        }
        badgeReacoesHTML += `</div>`;
      }

      row.innerHTML = `
        ${metaHeader}
        <div class="msg-bubble ${eMeu ? 'mine' : 'other'}" id="bubble-trigger-${id}">
          ${conteudoPrincipalHTML}
          <span class="msg-time">${horaStr}</span>
        </div>
        ${badgeReacoesHTML}
      `;

      // Eventos Dinâmicos da Bolha
      setTimeout(() => {
        const trigger = document.getElementById(`bubble-trigger-${id}`);
        if (trigger) {
          trigger.onclick = (e) => abrirMenuContextoAbsoluto(e, id, dados, eMeu);
        }
        const profClick = document.getElementById(`click-profile-${id}`);
        if (profClick) {
          profClick.onclick = () => visualizarImagemModal3x4(dados.avatar);
        }
      }, 5);

      return row;
    }

    function filtrarTextoMenções(txt) {
      if (!txt) return '';
      return txt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/(@\w+)/g, '<span style="font-weight:bold; color:inherit; text-decoration:underline;">$1</span>');
    }

    // ── GESTÃO DO MENU DE CONTEXTO E REAÇÕES ──
    window.abrirMenuContextoAbsoluto = (e, id, dados, eMeu) => {
      e.stopPropagation();
      ativoIdMensagemContexto = id;
      dadosMensagemContexto = dados;

      const popup = document.getElementById('popup-context-master');
      popup.style.display = 'flex';

      document.getElementById('ctx-btn-edit').style.display = eMeu ? 'block' : 'none';
      document.getElementById('ctx-btn-delete').style.display = eMeu ? 'block' : 'none';

      let x = e.clientX;
      let y = e.clientY;
      if (x + 260 > window.innerWidth) x = window.innerWidth - 280;
      if (y + 150 > window.innerHeight) y = window.innerHeight - 170;

      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
    };

    window.fecharJanelasFlutuantes = () => {
      document.getElementById('popup-context-master').style.display = 'none';
      document.getElementById('mentions-popover').style.display = 'none';
    };

    window.adicionarReacaoMensagem = async (emoji) => {
      fecharJanelasFlutuantes();
      const reacoesAtuais = dadosMensagemContexto.reacoes || {};
      let nicksQueReagiram = reacoesAtuais[emoji] || [];

      if (nicksQueReagiram.includes(sessaoLocalUsuario.nick)) {
        nicksQueReagiram = nicksQueReagiram.filter(n => n !== sessaoLocalUsuario.nick);
      } else {
        nicksQueReagiram.push(sessaoLocalUsuario.nick);
      }

      reacoesAtuais[emoji] = nicksQueReagiram;
      await updateDoc(doc(db, "mensagens", ativoIdMensagemContexto), { reacoes: reacoesAtuais });
    };

    window.processarCliqueBadgeReacao = async (id, emoji) => {
      // Método cirúrgico para remover ou adicionar reação direto no badge
      const msgRef = doc(db, "mensagens", id);
      const snap = await getDocs(query(collection(db, "mensagens")));
      let dadosAlvo = null;
      snap.forEach(d => { if(d.id === id) dadosAlvo = d.data(); });
      if(!dadosAlvo) return;

      const reacoes = dadosAlvo.reacoes || {};
      let lista = reacoes[emoji] || [];

      if (lista.includes(sessaoLocalUsuario.nick)) {
        lista = lista.filter(n => n !== sessaoLocalUsuario.nick);
      } else {
        lista.push(sessaoLocalUsuario.nick);
      }
      reacoes[emoji] = lista;
      await updateDoc(msgRef, { reacoes: reacoes });
    };

    // Ações do Contexto
    window.ativarModoRespostaDoContexto = () => {
      fecharJanelasFlutuantes();
      respostaAtivaObjeto = { id: ativoIdMensagemContexto, user: dadosMensagemContexto.usuario, text: dadosMensagemContexto.texto || 'Mídia' };
      document.getElementById('reply-preview-user').innerText = `Respondendo a ${respostaAtivaObjeto.user}`;
      document.getElementById('reply-preview-msg').innerText = respostaAtivaObjeto.text;
      document.getElementById('reply-preview-bar').style.display = 'flex';
      document.getElementById('typed-message').focus();
    };

    window.cancelarModoResposta = () => {
      respostaAtivaObjeto = null;
      document.getElementById('reply-preview-bar').style.display = 'none';
    };

    window.ativarModoEdicaoDoContexto = () => {
      fecharJanelasFlutuantes();
      emModoEdicao = true;
      document.getElementById('typed-message').value = dadosMensagemContexto.texto;
      document.getElementById('typed-message').focus();
    };

    window.removerMensagemDoContexto = async () => {
      fecharJanelasFlutuantes();
      await deleteDoc(doc(db, "mensagens", ativoIdMensagemContexto));
    };

    // ── ENVIO E UPSTREAM DE MENSAGENS ──
    window.gerenciarEnvioMensagem = async () => {
      const campo = document.getElementById('typed-message');
      const texto = campo.value.trim();
      if (!texto && !emModoEdicao) return;

      if (emModoEdicao) {
        await updateDoc(doc(db, "mensagens", ativoIdMensagemContexto), { texto: texto });
        emModoEdicao = false;
      } else {
        const pacote = {
          usuario: sessaoLocalUsuario.nick,
          avatar: sessaoLocalUsuario.avatar,
          texto: texto,
          tipo: 'texto',
          timestamp: Date.now(),
          reacoes: {}
        };
        if (respostaAtivaObjeto) {
          pacote.replyTo = { user: respostaAtivaObjeto.user, text: respostaAtivaObjeto.text };
          cancelarModoResposta();
        }
        await addDoc(collection(db, "mensagens"), pacote);
      }

      campo.value = '';
      campo.style.height = 'auto';
    };

    // Envio de Câmera/Galeria Automatizado ao selecionar arquivo
    document.getElementById('chat-gallery-input').onchange = (e) => {
      const arq = e.target.files[0];
      if (arq) {
        const leitor = new FileReader();
        leitor.onload = async (ev) => {
          const pacote = {
            usuario: sessaoLocalUsuario.nick,
            avatar: sessaoLocalUsuario.avatar,
            texto: '',
            tipo: 'imagem',
            midiaUrl: ev.target.result,
            timestamp: Date.now(),
            reacoes: {}
          };
          await addDoc(collection(db, "mensagens"), pacote);
        };
        leitor.readAsDataURL(arq);
      }
    };

    // ── SISTEMA DE ÁUDIO DE AUTO-DESEMPENHO ──
    window.gerenciarFluxoAudio = async () => {
      if (gravadorMidia && gravadorMidia.state === "recording") return;
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        fragmentosAudio = [];
        gravadorMidia = new MediaRecorder(stream);
        
        gravadorMidia.ondataavailable = (e) => { if (e.data.size > 0) fragmentosAudio.push(e.data); };
        gravadorMidia.onstop = async () => {
          if (fragmentosAudio.length === 0) return;
          const blobAudio = new Blob(fragmentosAudio, { type: 'audio/mp3' });
          const leitor = new FileReader();
          leitor.onload = async (ev) => {
            const pacote = {
              usuario: sessaoLocalUsuario.nick,
              avatar: sessaoLocalUsuario.avatar,
              texto: '',
              tipo: 'audio',
              midiaUrl: ev.target.result,
              timestamp: Date.now(),
              reacoes: {}
            };
            await addDoc(collection(db, "mensagens"), pacote);
          };
          leitor.readAsDataURL(blobAudio);
        };

        gravadorMidia.start();
        dispararPainelInterfaceAudio(true);
      } catch (err) {
        alert("Erro ao acessar permissões de áudio.");
      }
    };

    function dispararPainelInterfaceAudio(ativo) {
      document.getElementById('normal-input-fields').style.display = ativo ? 'none' : 'flex';
      document.getElementById('voice-record-panel').style.display = ativo ? 'flex' : 'none';
      document.getElementById('btn-audio-action').style.display = ativo ? 'none' : 'flex';
      
      if (ativo) {
        segundosGravadosAudio = 0;
        document.getElementById('voice-duration-clock').innerText = "00:00";
        cronometroAudioInterval = setInterval(() => {
          segundosGravadosAudio++;
          const min = String(Math.floor(segundosGravadosAudio / 60)).padStart(2, '0');
          const seg = String(segundosGravadosAudio % 60).padStart(2, '0');
          document.getElementById('voice-duration-clock').innerText = `${min}:${seg}`;
        }, 1000);
      } else {
        clearInterval(cronometroAudioInterval);
      }
    }

    window.cancelarGravacaoAudio = () => {
      if (gravadorMidia) {
        gravadorMidia.ondataavailable = null;
        gravadorMidia.stop();
        gravadorMidia.stream.getTracks().forEach(t => t.stop());
      }
      dispararPainelInterfaceAudio(false);
    };

    window.concluirEEnviarAudio = () => {
      if (gravadorMidia) {
        gravadorMidia.stop();
        gravadorMidia.stream.getTracks().forEach(t => t.stop());
      }
      dispararPainelInterfaceAudio(false);
    };

    // ── POPUP INTELIGENTE DE MENÇÕES INTERNAS ──
    const txInput = document.getElementById('typed-message');
    txInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = `${this.scrollHeight}px`;

      const txt = this.value;
      const rastro = txt.split(/\s+/);
      const ultimoRastro = rastro[rastro.length - 1];
      const pop = document.getElementById('mentions-popover');

      if (ultimoRastro.startsWith('@') && ultimoRastro.length > 1) {
        const busca = ultimoRastro.substring(1).toLowerCase();
        pop.innerHTML = '';
        let achouQualquer = false;

        listaUsuariosDoPainel.forEach(nick => {
          if (nick.toLowerCase().includes(busca)) {
            achouQualquer = true;
            const linha = document.createElement('div');
            linha.className = 'mention-row';
            linha.innerText = nick;
            linha.onclick = () => {
              rastro[rastro.length - 1] = nick + ' ';
              txInput.value = rastro.join(' ');
              pop.style.display = 'none';
              txInput.focus();
            };
            pop.appendChild(linha);
          }
        });
        pop.style.display = achouQualquer ? 'block' : 'none';
      } else {
        pop.style.display = 'none';
      }
    });

    // Enviar mensagem ao pressionar Enter (sem Shift)
    txInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        gerenciarEnvioMensagem();
      }
    });

    // ── VISUALIZADOR MODAL FORMATO CORPORATIVO 3X4 ──
    window.visualizarImagemModal3x4 = (url) => {
      if (!url) return;
      document.getElementById('target-modal-img').src = url;
      document.getElementById('modal-view-3x4').style.display = 'flex';
    };

    // ── MECÂNICA DO DRAWER E CUSTOMIZAÇÃO EM TEMPO REAL ──
    window.toggleDrawer = (abrir) => {
      document.getElementById('drawer-panel').classList[abrir ? 'add' : 'remove']('open');
    };

    window.aplicarPaletaPreset = (corHex) => {
      atualizarVariavelCor(corHex);
    };

    window.atualizarVariavelCor = (corHex) => {
      document.documentElement.style.setProperty('--tp', corHex);
      document.getElementById('picker-color-native').value = corHex;
      localStorage.setItem('cz_theme_color', corHex);
    };

    window.definirFundoTela = (srcUrl, elementCard) => {
      document.querySelectorAll('.bg-thumb-card').forEach(c => c.classList.remove('active'));
      if(elementCard) elementCard.classList.add('active');

      const painelMsg = document.getElementById('messages');
      if (srcUrl === 'none') {
        painelMsg.style.backgroundImage = 'none';
        localStorage.setItem('cz_theme_bg', 'none');
      } else {
        painelMsg.style.backgroundImage = `url(${srcUrl})`;
        localStorage.setItem('cz_theme_bg', srcUrl);
      }
    };

    function inicializarListaWallpapersNativos() {
      const grid = document.getElementById('container-wallpaper-options');
      if (window.CHATZAO_BG && window.CHATZAO_BG.length > 0) {
        window.CHATZAO_BG.forEach((bg) => {
          const card = document.createElement('div');
          card.className = 'bg-thumb-card';
          card.innerHTML = `<img src="${bg.src}" title="${bg.label}">`;
          card.onclick = () => definirFundoTela(bg.src, card);
          grid.appendChild(card);
        });
      }
    }

    function carregarConfiguracoesTemaSalvas() {
      const corSalva = localStorage.getItem('cz_theme_color');
      if (corSalva) atualizarVariavelCor(corSalva);

      const bgSalvo = localStorage.getItem('cz_theme_bg');
      setTimeout(() => {
        if (bgSalvo && bgSalvo !== 'none') {
          const painelMsg = document.getElementById('messages');
          painelMsg.style.backgroundImage = `url(${bgSalvo})`;
        }
      }, 200);
    }

    // Limpeza Mestre Protegida
    window.limparBancoDadosMestre = async () => {
      const token = prompt("Insira a Senha Mestre Corporativa para reset:");
      if (token === "220399") {
        if (confirm("Deseja realmente limpar todo o histórico de mensagens?")) {
          const snap = await getDocs(collection(db, "mensagens"));
          const batch = writeBatch(db);
          snap.forEach(d => batch.delete(d.ref));
          await batch.commit();
          alert("Histórico esvaziado com sucesso.");
          toggleDrawer(false);
        }
      } else {
        alert("Senha incorreta.");
      }
    };
  </script>
</body>
</html>
