<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chatzão Oficial</title>
    <style>
        /* Trava de Layout: garante que o app ocupe exatamente a área visível */
        * { box-sizing: border-box; touch-action: manipulation; }
        html, body { height: 100dvh; margin: 0; overflow: hidden; background: #0e0e0e; font-family: sans-serif; }
        
        .screen { display: none; height: 100dvh; flex-direction: column; }
        .screen.active { display: flex; }

        /* Login */
        #login-screen { justify-content: center; align-items: center; gap: 20px; }
        
        /* Chat */
        #chat-screen { background: #0e0e0e; }
        
        /* Logout e Logout-Fix */
        .btn-logout { background: #ff4d4d; color: white; padding: 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <h1>Bem-vindo</h1>
        <button onclick="entrar()">Entrar no Chat</button>
    </div>

    <div id="chat-screen" class="screen">
        <div id="topbar" style="background:#161616; padding:15px; display:flex; justify-content:space-between;">
            <span>Chat Amigos</span>
            <div class="btn-logout" onclick="fazerLogout()">Sair</div>
        </div>
        <div id="chat-window" style="flex:1; overflow-y:auto; padding:15px;"></div>
    </div>

    <script>
        // Lógica de Estado (Login/Logout)
        window.entrar = () => {
            localStorage.setItem('logado', 'true');
            mudarTela('chat-screen');
        };

        window.fazerLogout = () => {
            localStorage.removeItem('logado');
            location.reload(); // Recarrega para limpar o estado
        };

        window.mudarTela = (telaId) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(telaId).classList.add('active');
        };

        // Verifica ao carregar se já está logado
        if (localStorage.getItem('logado')) {
            mudarTela('chat-screen');
        }
    </script>
</body>
</html>
