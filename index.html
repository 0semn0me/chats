<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatzão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1>Chatzão</h1>
            <input type="text" id="real-name" placeholder="Nome real">
            <input type="text" id="nick-name" class="highlight-input" placeholder="Apelido (Destaque)">
            <button id="btn-login">Entrar</button>
        </div>
    </div>

    <div id="chat-screen" style="display: none;">
        <header>
            <div id="user-info"></div>
            <button id="btn-logout">Sair</button>
        </header>
        <div id="messages-container"></div>
        <div id="input-area">
            <button id="btn-audio">🎤</button>
            <textarea id="msg-input" placeholder="Mensagem..."></textarea>
            <button id="btn-send">➤</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
