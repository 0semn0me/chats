<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>Chatzão</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:system-ui,-apple-system,sans-serif;
  --r:8px;--rl:14px;
  --p:#534AB7;--pt:#fff;
  --bg:#0e0e0e;--s1:#141414;--s2:#1e1e1e;--s3:#2a2a2a;
  --b1:#222;--b2:#333;--b3:#444;
  --t1:#fff;--t2:#ccc;--t3:#888;--t4:#555;
}
/* Alterado para centralizar o layout no PC e dar um fundo escuro sutil ao redor */
html,body{height:100%;height:100dvh;background:#060606;overflow:hidden}
body{display:flex;flex-direction:column;font-family:var(--font);align-items:center;justify-content:center}

/* Ajustado para travar o tamanho de celular (480px) no PC e ocupar 100% no celular */
#app{
  display:flex;
  flex-direction:column;
  flex:1;
  width:100%;
  max-width:480px;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  box-shadow:0 0 20px rgba(0,0,0,0.7);
  border-left:0.5px solid var(--b1);
  border-right:0.5px solid var(--b1);
}

#login{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;padding:2rem;background:var(--bg)}
#login.active{display:flex}
.av-pick{width:78px;height:78px;border-radius:50%;background:var(--s2);border:2px dashed var(--b2);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;transition:border-color .2s;touch-action:manipulation}
.av-pick:hover{border-color:var(--p)}
.av-pick img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-icon{font-size:26px;color:var(--t4);pointer-events:none}
.login-row{display:flex;align-items:center;gap:14px;width:290px}
.login-fields{display:flex;flex-direction:column;gap:6px;flex:1}
.login-apelido{font-size:16px;font-weight:700;letter-spacing:-.3px;color:var(--t1);background:var(--s2);border:0.5px solid var(--b2);border-radius:var(--r);padding:10px 14px;outline:none;width:100%;font-family:var(--font);-webkit-appearance:none}
.login-nome{font-size:11px;color:var(--t3);background:var(--s2);border:0.5px solid var(--b2);border-radius:var(--r);padding:8px 14px;outline:none;width:100%;font-family:var(--font);-webkit-appearance:none}
.login-apelido:focus,.login-nome:focus{box-shadow:0 0 0 2px rgba(83,74,183,.35)}
.btn-enter{width:100%;padding:11px;font-size:15px;font-weight:700;border-radius:var(--r);border:none;background:var(--p);color:var(--pt);cursor:pointer;font-family:var(--font);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:opacity .15s;-webkit-appearance:none}
.btn-enter:hover{opacity:.85}
.login-err{font-size:12px;color:#f87171;display:none;text-align:center;max-width:280px}
#chat-area{display:none;flex-direction:column;height:100%;background:var(--bg)}
#chat-area.active{display:flex}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid var(--b1);background:var(--s1);flex-shrink:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:8px}
.btn-menu{background:none;border:none;color:var(--t2);cursor:pointer;font-size:22px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .1s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-menu:hover{background:var(--s3)}
.btn-lock{background:none;border:none;color:var(--t4);cursor:pointer;font-size:16px;display:flex;align-items:center;padding:4px;transition:color .2s;touch-action:manipulation}
.btn-lock:hover{color:#f87171}
.topbar-right{display:flex;align-items:center;gap:10px}
#me-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2)}
.btn-sair{background:none;border:0.5px solid var(--b2);color:var(--t3);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-family:var(--font);transition:color .15s;touch-action:manipulation}
.btn-sair:hover{color:#f87171}
#online-dot{width:11px;height:11px;border-radius:50%;background:#22c55e;cursor:pointer;border:2px solid var(--s1);position:relative;flex-shrink:0}
.online-tooltip{display:none;position:absolute;right:0;top:18px;background:var(--s2);border:0.5px solid var(--b2);border-radius:8px;padding:4px 10px;font-size:11px;color:#22c55e;white-space:nowrap;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.5);pointer-events:none}
#online-dot:hover .online-tooltip{display:block}
#messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;position:relative;background-size:cover;background-position:center;background-repeat:no-repeat}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px}
#bg-overlay{position:absolute;inset:0;z-index:0;pointer-events:none;transition:background .2s}
.msg{display:flex;flex-direction:column;gap:2px;max-width:82%;position:relative;z-index:1}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.theirs{align-self:flex-start;align-items:flex-start}
.bubble-wrapper{position:relative;display:flex;align-items:center;gap:6px;width:100%}
.mine .bubble-wrapper{flex-direction:row-reverse}
.bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;cursor:pointer;position:relative;white-space:pre-wrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mine .bubble{border-bottom-right-radius:3px}
.theirs .bubble{border-bottom-left-radius:3px}
.bubble img{max-width:260px;max-height:240px;border-radius:8px;display:block;pointer-events:auto;-webkit-touch-callout:default}
.bubble audio{display:block;max-width:240px;outline:none}
@keyframes delAlarm{
  0%  {background:rgba(59,130,246,.3);border-color:#3b82f6}
  20% {background:rgba(239,68,68,.3);border-color:#ef4444}
  40% {background:rgba(236,72,153,.3);border-color:#ec4899}
  60% {background:rgba(255,255,255,.2);border-color:#fff}
  80% {background:rgba(34,197,94,.3);border-color:#22c55e}
  100%{background:var(--s2);border-color:var(--b2);color:var(--t4)}
}
.bubble-deleted{animation:delAlarm 8s ease forwards!important;font-style:italic;border:1.5px solid}
.react-menu{position:absolute;top:-42px;background:var(--s2);border:0.5px solid var(--b2);border-radius:22px;padding:5px 10px;display:none;gap:6px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.5);max-width:320px;overflow-x:auto;white-space:nowrap;align-items:center}
.react-menu.open{display:flex}
@media(hover:hover){.bubble-wrapper:hover .react-menu{display:flex}}
.mine .react-menu{right:0}.theirs .react-menu{left:0}
.react-opt{font-size:18px;cursor:pointer;transition:transform .1s;padding:0 2px;display:inline-block;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.react-opt:hover,.react-opt:active{transform:scale(1.3)}
.msg-action-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;padding:3px 5px;border-radius:5px;transition:background .1s;touch-action:manipulation}
.msg-action-btn:hover{background:var(--b2);color:var(--t1)}
.msg-action-btn.del:hover{color:#f87171}
.react-badge{position:absolute;bottom:-10px;background:var(--s2);border:0.5px solid var(--b2);border-radius:10px;padding:1px 6px;font-size:12px;display:flex;gap:3px;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.mine .react-badge{right:8px}.theirs .react-badge{left:8px}
.reply-hint{opacity:0;transition:opacity .15s;font-size:14px;color:var(--t4);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bubble-wrapper:hover .reply-hint{opacity:1}
.reply-hint:hover{color:var(--p)}
.reply-preview{border-radius:8px 8px 0 0;padding:6px 10px;font-size:12px;margin-bottom:-4px;opacity:.85;border-left:3px solid rgba(255,255,255,.3);width:100%}
.meta{font-size:10px;color:var(--t3);padding:2px 4px;display:flex;align-items:center;gap:4px;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.edited-tag{font-size:9px;color:var(--t4);font-style:italic}
.senders{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.sender-names{display:flex;flex-direction:column;line-height:1.1}
.sender-nick{font-size:13px;font-weight:700}
.sender-fullname{font-size:9px;color:var(--t4);margin-top:1px;opacity:.7}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 2px 5px rgba(0,0,0,.4);touch-action:manipulation}
.avatar:hover{transform:scale(1.1)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:auto;-webkit-touch-callout:default}
.sys-msg{align-self:center;font-size:11px;color:var(--t4);padding:2px 0;z-index:1}
@keyframes pulseMention{0%{box-shadow:0 0 0 0 rgba(83,74,183,.7)}50%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.msg-mentioned{animation:pulseMention 1s ease-in-out 2;border:1px solid var(--p)!important}
#reply-bar,#edit-bar{display:none;align-items:center;gap:8px;padding:8px 14px;background:var(--s1);border-top:0.5px solid var(--b1);flex-shrink:0;z-index:5}
.rb-content{flex:1;min-width:0}
.rb-name{font-size:12px;font-weight:600;margin-bottom:1px}
.rb-text{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-close{background:none;border:none;cursor:pointer;color:var(--t4);font-size:16px;padding:2px 4px;touch-action:manipulation}
#emoji-panel{display:none;border-top:0.5px solid var(--b1);background:var(--s1);flex-shrink:0;z-index:5;max-height:48vmax}
.ep-search-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:0.5px solid var(--b1)}
.ep-search-row input{flex:1;font-size:13px;padding:6px 10px;border-radius:var(--r);border:0.5px solid var(--b2);background:var(--s2);color:var(--t1);outline:none;font-family:var(--font);-webkit-appearance:none}
.ep-close{background:none;border:none;cursor:pointer;color:var(--t4);font-size:18px;padding:2px 6px;touch-action:manipulation}
#emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:8px 14px;overflow-y:auto;max-height:40vmax}
#emoji-grid::-webkit-scrollbar{width:3px}
#emoji-grid::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px}
#emoji-grid span{font-size:28px;cursor:pointer;text-align:center;padding:3px;border-radius:8px;display:inline-block;touch-action:manipulation;-webkit-tap-highlight-color:transparent;line-height:1.3;user-select:none}
#emoji-grid span:hover,#emoji-grid span:active{background:var(--s3)}
.eg-sep{grid-column:1/-1;height:1px;background:var(--b1);margin:4px 0}
.eg-label{grid-column:1/-1;font-size:9px;color:var(--t4);letter-spacing:1.2px;text-transform:uppercase;padding:4px 0 2px}
#skin-popup{display:none;position:fixed;z-index:600;background:var(--s2);border:0.5px solid var(--b2);border-radius:14px;padding:8px 6px;box-shadow:0 6px 20px rgba(0,0,0,.6);flex-direction:column;gap:4px;align-items:center}
#skin-popup.open{display:flex}
.skin-btn{width:36px;height:36px;border-radius:50%;border:2px solid transparent;background:var(--b1);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.skin-btn.active{border-color:var(--t1)}
.skin-btn:hover{background:var(--b2)}
#camera-panel{display:none;border-top:0.5px solid var(--b1);background:var(--s1);flex-shrink:0;padding:10px 14px;z-index:5}
.cam-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--t3)}
.cam-wrap{position:relative;width:100%;max-width:320px;height:180px;margin:0 auto;background:#000;border-radius:8px;overflow:hidden;border:0.5px solid var(--b2)}
#cam-video{width:100%;height:100%;object-fit:cover}
.cam-controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;max-width:320px;margin-left:auto;margin-right:auto}
.btn-snap{width:46px;height:46px;border-radius:50%;background:var(--p);border:3px solid var(--t1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--pt);font-size:18px;touch-action:manipulation}
.btn-cam-ctrl{background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer;padding:6px;display:inline-flex;touch-action:manipulation}
#paste-preview,#audio-preview-bar{display:none;align-items:center;gap:8px;padding:6px 14px;background:var(--s1);border-top:0.5px solid var(--b1);flex-shrink:0;z-index:5}
#paste-preview img{height:48px;width:48px;object-fit:cover;border-radius:6px;border:0.5px solid var(--b2)}
#paste-preview span,#audio-preview-bar span{flex:1;font-size:12px;color:var(--t3)}
#paste-preview button,#audio-preview-bar button{background:none;border:none;cursor:pointer;color:var(--t4);font-size:16px;padding:2px 6px;touch-action:manipulation}
#inputbar{display:flex;align-items:center;gap:7px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--s1);border-top:0.5px solid var(--b1);flex-shrink:0;position:relative;z-index:5}
.audio-wrap{display:flex;align-items:center;position:relative}
#audio-float{display:none;position:absolute;left:44px;top:50%;transform:translateY(-50%);background:var(--s2);border:0.5px solid var(--b2);padding:4px 12px;border-radius:20px;align-items:center;gap:8px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap;max-width:180px}
#audio-float.show{display:flex}
#audio-timer{font-size:13px;color:var(--t1);font-family:monospace;font-weight:700}
#audio-trash{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;display:flex;touch-action:manipulation}
.btn-icon{background:none;border:none;font-size:20px;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:background .1s,color .2s;flex-shrink:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-icon:hover,.btn-icon.active{background:var(--s3)}
@keyframes pulseRec{0%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn-icon.rec{background:#dc2626!important;color:#fff!important;animation:pulseRec 1.5s infinite}
.btn-icon.paused-rec{background:#d97706!important;color:#fff!important}
#msg-input{flex:1;background:var(--s2);border:0.5px solid var(--b2);border-radius:20px;padding:9px 14px;font-size:16px;color:var(--t1);outline:none;resize:none;max-height:100px;font-family:var(--font);line-height:1.4;-webkit-appearance:none}
#msg-input::placeholder{color:var(--t4)}
#send-btn{background:var(--p);border:none;color:var(--pt);width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:background .1s,color .1s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#send-btn:hover{opacity:.85}
#send-btn:disabled{background:var(--b2);color:var(--t4);cursor:not-allowed}
#mention-panel{display:none;position:absolute;bottom:62px;left:14px;right:14px;background:var(--s2);border:0.5px solid var(--b2);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.6);z-index:200;max-height:160px;overflow-y:auto}
.mention-item{display:flex;align-items:center;gap:8px;padding:10px 14px;color:var(--t1);font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--b1);touch-action:manipulation}
.mention-item:last-child{border-bottom:none}
.mention-item:hover,.mention-item:active{background:var(--s3)}
.mention-badge{background:rgba(83,74,183,.2);color:var(--p);border:0.5px solid rgba(83,74,183,.4);font-weight:700;padding:1px 5px;border-radius:4px}
#drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;backdrop-filter:blur(3px)}
#drawer-overlay.open{display:block}

/* Menu lateral corrigido e fechado adequadamente */
#drawer{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:88vw;background:var(--s1);border-right:0.5px solid var(--b1);z-index:1001;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.16,1,.3,1);overflow-y:auto}
#drawer.open{transform:translateX(0)}
#drawer::-webkit-scrollbar{width:3px}
#drawer::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px}
.drawer-head{padding:18px 16px 14px;border-bottom:0.5px solid var(--b1);display:flex;align-items:center;gap:10px;flex-shrink:0}
.drawer-head-icon{width:36px;height:36px;border-radius:10px;background:var(--p);display:flex;align-items:center;justify-content:center;font-size:19px;transition:background .2s}
.drawer-section{padding:12px 16px 6px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t4)}
.drawer-cp-block{padding:0 16px 14px}
#dc-canvas{width:100%;height:130px;border-radius:10px;cursor:crosshair;touch-action:none;display:block;border:0.5px solid var(--b2)}
.dc-hue-row{display:flex;align-items:center;gap:10px;margin-top:10px}
#dc-hue{flex:1;-webkit-appearance:none;height:16px;border-radius:8px;outline:none;cursor:pointer;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#dc-hue::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.3);box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.dc-preview{width:28px;height:28px;border-radius:50%;border:2px solid var(--b2);flex-shrink:0;transition:background .1s}
.drawer-apply-btn{width:100%;margin-top:10px;padding:11px;border-radius:10px;border:none;background:var(--p);color:var(--pt);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s}
.drawer-apply-btn:hover{opacity:.85}
</style>
</head>
<body>
<div id="app">
  </div>

<div id="lightbox"><button id="lbx-close">×</button><img id="lbx-img" src="" alt=""/></div>

<div id="profile-modal">
  <div class="pm-card">
    <button class="pm-close-btn" id="pm-close">×</button>
    <div class="pm-av-box" id="pm-av"></div>
    <div class="pm-nick" id="pm-nick"></div>
    <div class="pm-full" id="pm-full"></div>
    <button class="pm-like-btn" id="pm-like"><i class="ti ti-heart-filled"></i> Curtir (<span id="pm-likes">0</span>)</button>
    <div class="pm-react-row" id="pm-react-row"></div>
    <div class="pm-reactions" id="pm-reactions"></div>
  </div>
</div>

<div id="skin-popup"></div>
<div id="drawer-overlay"></div>

<script src="bg.js"></script>
<script>

</script>
</body>
