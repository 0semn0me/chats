<style>
    /* Animação de Deleção */
    @keyframes colorPulse {
        0% { background: #3498db; }
        20% { background: #e74c3c; }
        40% { background: #ff69b4; }
        60% { background: #ffffff; color: #000; }
        80% { background: #2ecc71; }
        100% { background: #262626; }
    }
    .deleting-animation { animation: colorPulse 8s linear; }

    /* Layout da Janela de Emojis */
    .emoji-popover { display: none; position: absolute; bottom: 80px; width: 90%; background: #222; padding: 10px; border-radius: 12px; z-index: 100; }
    .skin-tone-row { display: flex; gap: 5px; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
</style>

<div id="emoji-menu" class="emoji-popover">
    <div id="emoji-content"></div>
</div>

<script type="module">
    // ... (Seu código base de Firebase aqui)

    // Lógica de animação ao deletar
    window.deletarMensagem = async (docId) => {
        const el = document.getElementById(docId);
        el.classList.add('deleting-animation');
        
        setTimeout(async () => {
            await deleteDoc(doc(db, "mensagens", docId));
        }, 8000); // Aguarda o ciclo de cores antes de sumir
    };

    // Gerador de Tabela de Emojis com tons de pele
    const tons = ["", "🏻", "🏼", "🏽", "🏾", "🏿"];
    const gerarEmojis = (listaBase) => {
        const container = document.getElementById('emoji-content');
        container.innerHTML = "";
        listaBase.forEach(emoji => {
            const row = document.createElement('div');
            row.className = "skin-tone-row";
            tons.forEach(ton => {
                const span = document.createElement('span');
                span.innerText = emoji + ton;
                span.onclick = () => inserirEmoji(span.innerText);
                row.appendChild(span);
            });
            container.appendChild(row);
        });
    };

    // Evento de clique na mensagem própria
    window.abrirOpcoes = (msgId, isMine) => {
        if(!isMine) return;
        // Criar modal flutuante com [Editar] e [Apagar]
        const modal = document.createElement('div');
        modal.innerHTML = `<button onclick="editar('${msgId}')">Editar</button><button onclick="deletarMensagem('${msgId}')">Apagar</button>`;
        document.body.appendChild(modal);
    };
</script>
