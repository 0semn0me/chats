<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk", projectId: "chatzao-a27ed" }));

    // Elementos da interface
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const myNick = document.getElementById('my-nick');

    // 1. CHECAGEM INSTANTÂNEA
    const user = JSON.parse(localStorage.getItem('user'));
    
    // Esconde tudo no início para evitar o "flash" da tela branca
    if (user) {
        exibirChat(user);
    } else {
        loginScreen.style.display = 'flex';
    }

    function exibirChat(user) {
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        myNick.innerText = user.nick;
        carregarMensagens(user.nick);
    }

    // 2. LOGIC DE LOGIN (Sem recarregar)
    window.fazerLogin = () => {
        const nome = document.getElementById('in-real').value;
        const nick = document.getElementById('in-nick').value;
        const avatar = document.getElementById('avatar-img').src;
        
        if(!nome || !nick) return alert("Preencha tudo!");
        
        const userData = { nome, nick, avatar };
        localStorage.setItem('user', JSON.stringify(userData));
        exibirChat(userData);
    };

    document.getElementById('btn-enter').onclick = fazerLogin;

    // 3. CARREGAMENTO DE MENSAGENS
    function carregarMensagens(meuNick) {
        const q = query(collection(db, "mensagens"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snap) => {
            const container = document.getElementById('messages');
            container.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                container.innerHTML += `
                    <div class="msg ${m.usuario === meuNick ? 'mine' : ''}">
                        ${m.texto}
                    </div>`;
            });
            container.scrollTop = container.scrollHeight;
        });
    }

    // Funções de apoio
    window.sair = () => { localStorage.clear(); location.reload(); };
    window.enviar = async () => {
        const input = document.getElementById('msg-input');
        const user = JSON.parse(localStorage.getItem('user'));
        if(!input.value) return;
        await addDoc(collection(db, "mensagens"), { usuario: user.nick, texto: input.value, timestamp: Date.now() });
        input.value = "";
    };
</script>
