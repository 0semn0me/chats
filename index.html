<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Central de Mapeamento - Chatzão</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--font-sans:system-ui,-apple-system,sans-serif;--theme-primary:#E24B4A;--theme-text:#ffffff;}
    html,body{height:100%;height:100dvh;background:#0e0e0e;overflow:hidden;font-family:var(--font-sans)}
    #app{display:flex;flex-direction:column;flex:1;height:100%;height:100dvh;background:#0e0e0e;overflow:hidden}
    
    /* Menu Lateral */
    #settings-menu{display:none;position:fixed;top:0;left:0;width:260px;height:100%;background:#161616;z-index:9999;padding:20px;border-right:1px solid #333;color:#fff}
    #settings-menu.open{display:block}
    .bg-options-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
    .bg-option{background:#222;padding:12px;border-radius:8px;cursor:pointer;text-align:center;font-size:13px}
    
    #topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid #222;background:#161616}
    #messages{flex:1;overflow-y:auto;padding:12px;background-size:cover;background-position:center;background-repeat:no-repeat;transition:filter 0.3s}
    
    /* Ajustes simples para manter o restante funcional */
    #chat-area{display:none;flex-direction:column;height:100%;background:#0e0e0e}
    .btn-icon{background:none;border:none;color:var(--theme-primary);font-size:22px;cursor:pointer}
    #msg-input{flex:1;background:#222;border:1px solid #333;border-radius:20px;padding:10px;color:#fff}
    #send-btn{background:var(--theme-primary);color:#fff;border:none;padding:10px 15px;border-radius:20px;cursor:pointer}
    #inputbar{display:flex;padding:10px;gap:8px;background:#161616}
  </style>
</head>
<body>

<div id="settings-menu">
  <div style="font-weight:bold;margin-bottom:20px;">Configurações</div>
  <button id="close-menu" style="background:none;border:none;color:#fff;cursor:pointer;">Fechar X</button>
  <div style="margin-top:20px;font-size:12px;color:#666;">BRILHO DO FUNDO</div>
  <input type="range" id="brightness-slider" min="10" max="100" value="100" style="width:100%;margin-top:10px;">
  <div style="margin-top:20px;font-size:12px;color:#666;">FONDOS</div>
  <div class="bg-options-grid">
    <div class="bg-option" data-bg="url('https://i.imgur.com/homer.jpg')">Homer</div>
    <div class="bg-option" data-bg="url('https://i.imgur.com/medusa.jpg')">Medusa</div>
    <div class="bg-option" data-bg="url('https://i.imgur.com/nuvens.jpg')">Nuvens</div>
    <div class="bg-option" data-bg="none">Padrão Escuro</div>
  </div>
</div>

<div id="app">
  <div id="chat-area">
    <div id="topbar">
      <button class="btn-icon" id="menu-btn"><i class="ti ti-menu-2"></i></button>
      <button class="btn-icon" id="logout-btn"><i class="ti ti-logout"></i></button>
    </div>
    <div id="messages"></div>
    <div id="inputbar">
      <textarea id="msg-input" placeholder="Mensagem..." rows="1"></textarea>
      <button id="send-btn">Enviar</button>
    </div>
  </div>
</div>

<script>
  // Controle Menu
  const menu = document.getElementById('settings-menu');
  document.getElementById('menu-btn').addEventListener('click', () => menu.classList.add('open'));
  document.getElementById('close-menu').addEventListener('click', () => menu.classList.remove('open'));

  // Brilho
  const slider = document.getElementById('brightness-slider');
  const msgArea = document.getElementById('messages');
  slider.addEventListener('input', (e) => {
    const val = e.target.value / 100;
    msgArea.style.filter = `brightness(${val})`;
    localStorage.setItem('brilho_bg', val);
  });

  // Fundos
  document.querySelectorAll('.bg-option').forEach(el => {
    el.addEventListener('click', () => {
      const bg = el.getAttribute('data-bg');
      msgArea.style.backgroundImage = bg === 'none' ? 'none' : bg;
      localStorage.setItem('fundo_bg', bg);
      menu.classList.remove('open');
    });
  });

  // Carregar ao iniciar
  window.onload = () => {
    const b = localStorage.getItem('brilho_bg') || 1;
    const f = localStorage.getItem('fundo_bg') || 'none';
    msgArea.style.filter = `brightness(${b})`;
    msgArea.style.backgroundImage = f === 'none' ? 'none' : f;
    slider.value = b * 100;
  };
</script>
</body>
</html>
