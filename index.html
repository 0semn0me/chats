<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatzão</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0e0e0e; --theme-primary: #fcd535; --theme-text: #000; --border-radius-md: 8px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-dark); color: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .screen { display: none; height: 100%; flex-direction: column; }
        .active { display: flex; }
        
        /* LOGIN REVISADO */
        #login { flex: 1; align-items: center; justify-content: center; padding: 20px; }
        .login-box { width: 100%; max-width: 300px; background: #1a1a1a; padding: 25px; border-radius: 15px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .avatar-pick { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #333; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
        .avatar-pick img { width: 100%; height: 100%; object-fit: cover; }
        .login-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn-icon { width: 40px; height: 40px; border-radius: 50%; border: none; background: #333; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        input { width: 100%; padding: 12px; border-radius: var(--border-radius-md); border: 1px solid #333; background: #222; color: white; }
        button.main-btn { width: 100%; padding: 12px; background: var(--theme-primary); border: none; border-radius: var(--border-radius-md); font-weight: bold; cursor: pointer; }

        /* CHAT REVISADO */
        header { padding: 15px; background: #1a1a1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        #chat-window { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-footer { padding: 10px; background: #1a1a1a; display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>

    <div id="login" class="screen active">
        <div class="login-box">
            <div class="avatar-pick" id="avatar-preview">👤</div>
            <div class="login-row">
                <button class="btn-icon" onclick="sortearAvatar()"><i class="fas fa-sync"></i></button>
                <input type="file" id="upload-avatar" hidden onchange="uploadFoto(this)">
                <button class="btn-icon" onclick="document.getElementById('upload-avatar').click()"><i class="fas fa-camera"></i></button>
            </div>
            <input type="text" id="in-nome" placeholder="Nome Real">
            <input type="text" id="in-nick" placeholder="Apelido">
            <button class="main-btn" onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <header>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="display-nick"></span>
                <button class="btn-icon" style="width:30px; height:30px; font-size:12px" onclick="senhaMestre()"><i class="fas fa-lock"></i></button>
            </div>
            <button class="main-btn" style="width:auto; padding:5px 15px" onclick="sair()">Sair</button>
        </header>
        <div id="chat-window"></div>
        <div class="chat-footer">
            <input type="text" id="msg-input" placeholder="Mensagem...">
            <button class="btn-icon" style="background:var(--theme-primary); color:black" onclick="enviar()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = { /* Sua config Firebase aqui */ };
        const db = getFirestore(initializeApp(firebaseConfig));

        let avatarData = "👤";

        window.sortearAvatar = () => {
            const avatares = ["👽", "🤖", "🤡", "😎", "🦊", "🦁"];
            avatarData = avatares[Math.floor(Math.random() * avatares.length)];
            document.getElementById('avatar-preview').innerText = avatarData;
        };

        window.uploadFoto = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    avatarData = e.target.result;
                    document.getElementById('avatar-preview').innerHTML = `<img src="${avatarData}">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.fazerLogin = () => {
            const nome = document.getElementById('in-nome').value;
            const nick = document.getElementById('in-nick').value;
            if(nome && nick) {
                localStorage.setItem('user', JSON.stringify({ nome, nick, avatar: avatarData }));
                location.reload();
            }
        };

        window.senhaMestre = async () => {
            if(prompt("Senha Mestre:") === "220399") {
                const snap = await getDocs(collection(db, "mensagens"));
                snap.forEach(d => deleteDoc(d.ref));
            }
        };

        window.sair = () => { localStorage.clear(); location.reload(); };

        if(localStorage.getItem('user')) {
            document.getElementById('login').classList.remove('active');
            document.getElementById('chat-screen').classList.add('active');
            const user = JSON.parse(localStorage.getItem('user'));
            document.getElementById('display-nick').innerText = user.nick;
        }
    </script>
</body>
</html>
