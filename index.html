html,body{height:100dvh;background:var(--bg);overflow:hidden;font-family:system-ui}
/* Drawer */
#drawer{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#1e1e1e;z-index:999;transition:0.3s;padding:20px;color:white;}
#drawer.open{left:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;z-index:998;}

<body>

    apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk",

<script src="bg.js"></script>
<script>
function toggleDrawer(){
    document.getElementById('drawer').classList.toggle('open');
    document.getElementById('overlay').style.display = document.getElementById('drawer').classList.contains('open') ? 'block' : 'none';
}

function init() {
    if (!window.db) { setTimeout(init, 100); return; }
    // AQUI ENTRA TODO O SEU CÓDIGO JS DE MENSAGENS QUE VOCÊ JÁ TEM
