<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
  <title>Premium Friends Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">Chatzão</div>
      
      <div class="input-group">
        <label class="label-field">Nominho - inho</label>
        <input type="text" id="nome-real-input" class="input-field" placeholder="Abigail da CRARO" autocomplete="off">
      </div>

      <div class="input-group">
        <label class="label-field">buli gratis</label>
        <input type="text" id="nick-input" class="input-field" placeholder="CRARO DA OI" maxlength="15" autocomplete="off">
      </div>

      <div class="input-group">
  <label class="label-field">Sua Fotinho de Perfil</label>
  <button id="avatar-upload-trigger" class="bg-item-btn">
    <i class="ti ti-camera"></i> Selecionar imagem do dispositivo
  </button>
  <input type="file" id="avatar-file-input" accept="image/*" style="display:none">
  <span id="avatar-status" style="font-size:10px; color:var(--p); margin-top:4px; display:none;">Foto selecionada com sucesso!</span>
</div>


      <button id="enter-btn" class="login-btn"><i class="ti ti-login"></i> Entrar no Chat</button>
    </div>
  </div>

  <div id="app">
    <div id="bg-overlay"></div>
    
    <div id="header">
      <div class="h-left">
        <button id="open-menu-btn" class="menu-btn"><i class="ti ti-menu-2 icon-dynamic"></i></button>
        <div class="room-info">
          <span class="room-title">Chatzão</span>
          <span class="room-status">Estúdio Particular</span>
        </div>
      </div>
      <div class="h-right">
        <div id="status-online-trigger" class="status-dot"></div>
        <button id="sair-btn" class="icon-btn"><i class="ti ti-logout icon-dynamic"></i></button>
      </div>
    </div>

    <div id="online-users-flav" class="floating-flav">
      <h3>Membros Ativos (@)</h3>
      <ul id="online-users-list"></ul>
    </div>

    <div id="chat-container"></div>

    <div id="bar-panels">
      <div id="reply-panel" class="panel-alert">
        <div class="left">
          <i class="ti ti-arrow-back-up icon-dynamic"></i>
          <span id="reply-text">Respondendo...</span>
        </div>
        <button id="reply-cancel" class="close-btn"><i class="ti ti-x"></i></button>
      </div>
      
      <div id="edit-panel" class="panel-alert">
        <div class="left">
          <i class="ti ti-edit icon-dynamic"></i>
          <span id="edit-text">Editando mensagem...</span>
        </div>
        <button id="edit-cancel" class="close-btn"><i class="ti ti-x"></i></button>
      </div>

      <div id="paste-preview">
        <img id="paste-img-el" alt="Preview">
        <span style="font-size:12px;color:var(--t2);flex:1">Mídia pronta para envio nativo</span>
        <button id="paste-cancel" class="bar-icon"><i class="ti ti-x"></i></button>
      </div>

      <div id="input-bar">
        <div class="input-wrapper">
          <button id="emoji-toggle-btn" class="bar-icon"><i class="ti ti-mood-smile icon-dynamic"></i></button>
          <button id="img-btn" class="bar-icon"><i class="ti ti-photo icon-dynamic"></i></button>
          <input type="file" id="img-input" accept="image/*" style="display:none">
          
          <textarea id="full-input" placeholder="Mensagem..." rows="1"></textarea>
          
          <div id="mic-dock-container">
            <span id="mic-timer">00:00</span>
            <button id="mic-btn" class="bar-icon"><i class="ti ti-microphone icon-dynamic"></i></button>
          </div>
        </div>
        <button id="send-btn"><i class="ti ti-send"></i></button>
      </div>

      <div id="emoji-keyboard" class="emoji-box-hidden">
        <div class="emoji-tabs">
          <button class="tab-item active" data-cat="regulares">Rostos</button>
          <button class="tab-item" data-cat="maos">Mãos 👍</button>
          <button class="tab-item" data-cat="pessoas">Pessoas 🙍</button>
        </div>
        <div id="emoji-grid-render" class="emoji-render-zone"></div>
      </div>
    </div>
  </div>

  <div id="skin-tone-picker" class="skin-picker-hidden"></div>

  <div id="drawer">
    <div class="drawer-head">
      <span class="drawer-title">Ajustes Internos</span>
      <button id="close-menu-btn" class="menu-btn"><i class="ti ti-arrow-left icon-dynamic"></i></button>
    </div>
    
    <div class="drawer-section">Seu Tema Chroma</div>
    <div class="chroma-container">
      <canvas id="dc-canvas"></canvas>
      <input type="range" id="dc-hue" min="0" max="360" value="245">
    </div>
    
    <div class="drawer-section">Planos de Fundo Originais</div>
    <div class="bg-grid-list">
      <input type="file" id="bg-upload-input" accept="image/*" style="display: none;">
      <button class="bg-item-btn upload-btn" id="bg-upload-trigger">
        <i class="ti ti-cloud-upload"></i> Upload de Imagem Nativa
      </button>
      <div id="drawer-bg-list"></div>
    </div>
  </div>
  <div id="drawer-overlay"></div>

  <div id="msg-actions-sheet">
    <div class="actions-card">
      <div class="reactions-row-header" id="reactions-header-box">
        <span class="react-click" data-emo="❤️">❤️</span>
        <span class="react-click" data-emo="👍">👍</span>
        <span class="react-click" data-emo="😂">😂</span>
        <span class="react-click" data-emo="😮">😮</span>
        <span class="react-click" data-emo="😢">😢</span>
        <span class="react-click" data-emo="🙏">🙏</span>
      </div>
      <button id="act-reply" class="action-item"><i class="ti ti-arrow-back-up icon-dynamic"></i> Responder</button>
      <button id="act-copy" class="action-item"><i class="ti ti-copy icon-dynamic"></i> Copiar Texto</button>
      <button id="act-edit" class="action-item"><i class="ti ti-edit icon-dynamic"></i> Editar Mensagem</button>
      <button id="act-del" class="action-item danger"><i class="ti ti-trash"></i> Apagar Mensagem</button>
      <button id="act-cancel" class="action-item cancel-btn"><i class="ti ti-x"></i> Fechar</button>
    </div>
  </div>

  <div id="lightbox">
    <button id="lbx-close"><i class="ti ti-x"></i></button>
    <img id="lbx-img" alt="Alta Fidelidade">
  </div>

  <script src="bg.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
