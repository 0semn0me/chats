<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Chatzão - Geral</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--font-sans:system-ui,-apple-system,sans-serif;--border-radius-md:8px;--theme-primary: #E24B4A;--theme-text: #ffffff;}
    html,body{height:100%;height:100dvh;background:#0e0e0e;overflow:hidden;}
    body{display:flex;flex-direction:column;}
    #app{display:flex;flex-direction:column;flex:1;height:100%;height:100dvh;font-family:var(--font-sans);background:#0e0e0e;overflow:hidden}
    #login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:2rem;background:#0e0e0e}
    #login input, #login button{width:260px;padding:10px;border-radius:var(--border-radius-md);border:0.5px solid #333;background:#1a1a1a;color:#fff;outline:none}
    #chat-area{display:none;flex-direction:column;height:100%;background:#0e0e0e}
    #messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
    #inputbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#161616;border-top:0.5px solid #222}
    #msg-input{flex:1;background:#222;border:0.5px solid #333;border-radius:20px;padding:9px 14px;color:#fff;outline:none}
  </style>
</head>
<body>

<div id="app">
  <div id="login">
    <h2>Chatzão</h2>
    <input id="name-input" type="text" placeholder="Seu nome..." maxlength="30"/>
    <button id="enter-btn">Entrar</button>
  </div>
  
  <div id="chat-area">
    <div id="messages"></div>
    <div id="inputbar">
      <textarea id="msg-input" placeholder="Mensagem..." rows="1"></textarea>
      <button id="send-btn"><i class="ti ti-send"></i></button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, collection, addDoc, getDocs, writeBatch, doc, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk",
    authDomain: "chatzao-a27ed.firebaseapp.com",
    projectId: "chatzao-a27ed",
    storageBucket: "chatzao-a27ed.firebasestorage.app",
    messagingSenderId: "923740068926",
    appId: "1:923740068926:web:f4d36655ac6c3460f5056f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const col = collection(db, 'mensagens');

  // Lógica de Limpeza Finalizada
  async function limparHistoricoGeral() {
    const senhaMestre = "220399"; 
    const inputSenha = prompt("Digite a senha mestre para limpar o histórico:");
    
    if (inputSenha !== senhaMestre) {
      if(inputSenha !== null) alert("Senha incorreta!");
      return;
    }

    if(!confirm("Tem certeza absoluta?")) return;

    try {
      const snapshot = await getDocs(col);
      const batch = writeBatch(db);
      snapshot.forEach((doc) => {
        batch.delete(doc.ref);
      });
      await batch.commit();
      alert("Histórico deletado com sucesso!");
    } catch (e) {
      alert("Erro ao limpar: " + e.message);
    }
  }

  // Event Listeners básicos
  document.getElementById('enter-btn').addEventListener('click', () => {
    document.getElementById('login').style.display = 'none';
    document.getElementById('chat-area').style.display = 'flex';
  });

  document.getElementById('lock-clear-btn')?.addEventListener('click', limparHistoricoGeral);
  
  console.log("Sistema Chatzão carregado.");
</script>

</body>
</html>
