<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatzão Premium</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root { --theme-primary: #F4D03F; --bg-dark: #0e0e0e; }
        body { background: var(--bg-dark); color: #fff; margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        
        /* Topbar com Configuração de Cor */
        #topbar { padding: 15px; background: #161616; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .config-area { display: flex; align-items: center; gap: 10px; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; }
        .msg { padding: 10px; margin-bottom: 8px; border-radius: 12px; background: #262626; cursor: pointer; max-width: 80%; }
        .msg.mine { background: var(--theme-primary); color: #000; align-self: flex-end; margin-left: auto; }

        /* Tabela de Emojis (Oculta até seleção) */
        #emoji-menu { display: none; position: fixed; bottom: 80px; background: #222; padding: 10px; border-radius: 15px; border: 1px solid var(--theme-primary); }
    </style>
</head>
<body>

<div id="topbar">
    <div id="user-info">DeMenor <i class="ti ti-lock" onclick="limparTudo()"></i></div>
    <div class="config-area">
        Cor: <input type="color" onchange="document.documentElement.style.setProperty('--theme-primary', this.value)">
        <span onclick="sair()" style="cursor:pointer">Sair</span>
    </div>
</div>

<div id="messages"></div>

<div id="emoji-menu"> 🍎 🎈 ⚡ 🚀 🤖 💎 </div>

<div style="padding:10px; display:flex; gap:10px;">
    <input id="msg-input" style="flex:1; padding:10px; border-radius:20px; border:none;" placeholder="Mensagem...">
    <button onclick="enviar()" style="background:var(--theme-primary); border:none; padding:10px 20px; border-radius:20px;">Enviar</button>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, writeBatch, doc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk", projectId: "chatzao-a27ed" }));

    // 1. Limpeza TOTAL (Usando Batch para garantir que nada fique para trás)
    window.limparTudo = async () => {
        if(prompt("Senha Mestre:") === "220399") {
            const snap = await getDocs(collection(db, "mensagens"));
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
            location.reload();
        }
    };

    // 2. Seleção de Mensagem (Para abrir emojis)
    document.addEventListener('click', (e) => {
        const menu = document.getElementById('emoji-menu');
        if(e.target.classList.contains('msg')) {
            menu.style.display = 'block'; // Aqui você vai integrar sua lista de emojis
        } else {
            menu.style.display = 'none';
        }
    });

    // 3. Renderização (Lógica de mensagens)
    onSnapshot(query(collection(db, "mensagens"), orderBy("timestamp", "asc")), (snap) => {
        const container = document.getElementById('messages');
        container.innerHTML = "";
        snap.forEach(d => {
            const m = d.data();
            const div = document.createElement('div');
            div.className = `msg ${m.usuario === 'DeMenor' ? 'mine' : ''}`;
            div.innerText = m.texto;
            container.appendChild(div);
        });
    });

    window.enviar = async () => {
        const input = document.getElementById('msg-input');
        if(!input.value) return;
        await addDoc(collection(db, "mensagens"), { usuario: 'DeMenor', texto: input.value, timestamp: Date.now() });
        input.value = "";
    };

    window.sair = () => { localStorage.clear(); location.reload(); };
</script>
</body>
</html>
