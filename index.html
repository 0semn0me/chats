<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBT2oZvEf2UNRPn6auwYwpjGIsHSa5oOYk", projectId: "chatzao-a27ed" }));

    // 1. CARREGAMENTO INICIAL
    const user = JSON.parse(localStorage.getItem('user'));

    // Verifica se já existe login e força a transição visual
    if(user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('my-nick').innerText = user.nick;
        carregarChat();
    }

    // 2. FUNÇÃO DE LOGIN (Sem recarregar a página)
    window.fazerLogin = () => {
        const nome = document.getElementById('in-real').value;
        const nick = document.getElementById('in-nick').value;
        const avatar = document.getElementById('avatar-img').src;
        
        if(!nome || !nick) {
            alert("Preencha ambos os campos!");
            return;
        }

        // Salva e transiciona manualmente
        localStorage.setItem('user', JSON.stringify({nome, nick, avatar}));
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('my-nick').innerText = nick;
        carregarChat();
    };

    // 3. VINCULA O BOTÃO
    document.getElementById('btn-enter').addEventListener('click', fazerLogin);

    // 4. FUNÇÃO DE CHAT (Isolada para não conflitar)
    function carregarChat() {
        onSnapshot(query(collection(db, "mensagens"), orderBy("timestamp", "asc")), (snap) => {
            const container = document.getElementById('messages');
            container.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                container.innerHTML += `<div class="msg ${m.usuario === JSON.parse(localStorage.getItem('user')).nick ? 'mine' : ''}">${m.texto}</div>`;
            });
            container.scrollTop = container.scrollHeight;
        });
    }

    // ... (restante das suas funções de sortearAvatar, enviar, etc)
</script>
