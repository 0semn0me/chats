<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatzão Oficial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root { --primary: #F4D03F; --bg: #0e0e0e; --panel: #161616; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Bar */
        #topbar { padding: 15px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        
        /* Menu Lateral (Hamburguer) */
        #menu { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: #222; transition: 0.3s; padding: 20px; z-index: 1000; }
        #menu.open { left: 0; }

        /* Chat Area */
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Input Area (Onde o layout brilha) */
        #footer { padding: 10px; background: var(--panel); display: flex; align-items: center; gap: 8px; }
        .input-wrapper { flex: 1; display: flex; align-items: center; background: #222; border-radius: 20px; padding: 5px 10px; }
        input { flex: 1; background: transparent; border: none; color: #fff; padding: 8px; }
    </style>
</head>
<body>

<div id="menu">
    <i class="ti ti-lock" onclick="senhaMestre()"></i>
    <h3>Configurações</h3>
    <input type="color" onchange="document.documentElement.style.setProperty('--primary', this.value)">
    </div>

<div id="topbar">
    <i class="ti ti-menu-2" onclick="document.getElementById('menu').classList.toggle('open')"></i>
    <div id="profile-pic" style="width:40px; height:40px; border-radius:50%; background:#333; overflow:hidden;">
        <img id="avatar" src="" style="width:100%; height:100%; object-fit:cover;">
    </div>
</div>

<div id="chat"></div>

<div id="footer">
    <i class="ti ti-microphone"></i>
    <i class="ti ti-mood-smile" onclick="toggleEmojis()"></i>
    <div class="input-wrapper">
        <input id="msg-input" placeholder="Mensagem...">
        <i class="ti ti-camera" onclick="document.getElementById('file-input').click()"></i>
        <input type="file" id="file-input" style="display:none">
    </div>
    <i class="ti ti-send" onclick="enviar()"></i>
</div>

<script type="module">
    // Firebase e lógica de estado
    // Aqui entra sua integração Firebase (Firestore)
    
    // 1. Perfil Foto Aleatória
    const avatar = document.getElementById('avatar');
    avatar.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${Math.random()}`;
    
    // 2. Lógica de Upload (Galeria)
    document.getElementById('file-input').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (event) => avatar.src = event.target.result;
        reader.readAsDataURL(e.target.files[0]);
    };
    
    // 3. Senha Mestre (Fica no menu)
    window.senhaMestre = () => {
        if(prompt("Senha:") === "220399") { /* Lógica de delete massivo */ }
    };
</script>
</body>
</html>
